<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Grand Luxury Tree - Spring Festival Edition</title>
    <style>
        /* 修改背景为深色渐变，不再是纯黑 */
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);

            /* 主题视觉变量：默认春节（橙红），body[data-theme="birthday"] 覆盖为生日（粉紫） */
            --accent: #ff4500;
            --accent-rgb: 255, 69, 0;
            --title-grad-top: #fff;
            --title-grad-bottom: #ff4500;
            --title-glow: rgba(252, 238, 167, 0.6);
            --page-bg: radial-gradient(circle at center, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --page-bg-color: #050d1a;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--page-bg);
            background-color: var(--page-bg-color); /* Fallback */
            font-family: 'Times New Roman', serif; 
        }

        /* 生日主题：玫瑰粉强调色 + 梦幻紫夜背景 + 粉金标题 */
        body[data-theme="birthday"] {
            --accent: #ff7bac;
            --accent-rgb: 255, 123, 172;
            --title-grad-top: #fff5fa;
            --title-grad-bottom: #ff7bac;
            --title-glow: rgba(255, 158, 196, 0.65);
            --page-bg: radial-gradient(circle at center, #221038 0%, #3b1a54 50%, #582b6e 100%);
            --page-bg-color: #160b28;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
            touch-action: none;
        }

        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* UI Overlay */
        #ui-layer {
            position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; 
            align-items: center;
            padding-top: calc(40px + var(--safe-top));
            padding-right: var(--safe-right);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left);
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }
        
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Loading */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--page-bg-color); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        .loader-text {
            color: var(--accent); font-size: 14px; letter-spacing: 4px; margin-top: 20px;
            text-transform: uppercase; font-weight: 100;
        }
        .spinner {
            width: 40px; height: 40px; border: 1px solid rgba(var(--accent-rgb), 0.2);
            border-top: 1px solid var(--accent); border-radius: 50%; 
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Typography */
        h1 { 
            color: #fceea7; font-size: clamp(32px, 4vw, 56px); margin: 0; font-weight: 400;
            letter-spacing: 6px;
            max-width: min(72vw, 900px);
            text-align: center;
            line-height: 1.15;
            text-shadow: 0 0 50px var(--title-glow); 
            background: linear-gradient(to bottom, var(--title-grad-top), var(--title-grad-bottom));
            animation: titleGlowBreathe 4.5s ease-in-out infinite;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Cinzel', 'Times New Roman', serif;
            opacity: 0.9;
            transition: opacity 0.5s ease;
        }

        /* 标题光晕呼吸 */
        @keyframes titleGlowBreathe {
            0%, 100% { text-shadow: 0 0 36px var(--title-glow); }
            50% { text-shadow: 0 0 58px var(--title-glow), 0 0 92px var(--title-glow); }
        }

        /* Controls */
        .controls-wrapper {
            position: absolute;
            top: calc(30px + var(--safe-top));
            right: calc(30px + var(--safe-right));
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 20;
            transition: opacity 0.5s ease;
            max-height: calc(100dvh - 60px - var(--safe-top) - var(--safe-bottom));
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            transform-origin: top right;
            transition:
                opacity 0.45s ease,
                transform 0.45s ease,
                visibility 0.45s ease;
            max-height: inherit;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
        }

        .controls-wrapper.collapsed .controls-panel {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px) scale(0.98);
            visibility: hidden;
        }

        .controls-toggle {
            width: 38px;
            height: 38px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid rgba(var(--accent-rgb), 0.45);
            background: rgba(5, 13, 26, 0.55);
            color: var(--accent);
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px);
            transition:
                opacity 0.45s ease,
                transform 0.45s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
            backdrop-filter: blur(6px);
        }

        .controls-wrapper.collapsed .controls-toggle {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .controls-toggle:hover,
        .controls-toggle:focus-visible {
            background: rgba(var(--accent-rgb), 0.16);
            box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.35);
            outline: none;
        }

        .photo-icon {
            position: relative;
            width: 18px;
            height: 14px;
            border: 1px solid currentColor;
            box-sizing: border-box;
        }

        .photo-icon::before {
            content: "";
            position: absolute;
            top: 2px;
            right: 2px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: currentColor;
        }

        .photo-icon::after {
            content: "";
            position: absolute;
            left: 2px;
            bottom: 2px;
            width: 11px;
            height: 6px;
            background: linear-gradient(135deg, transparent 48%, currentColor 50%, transparent 54%);
            opacity: 0.9;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .upload-btn {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(var(--accent-rgb), 0.4);
            color: var(--accent); 
            padding: 10px 20px; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 10px;
            transition: all 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            min-width: 120px;
            min-height: 40px;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        .upload-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.5);
        }

        .greeting-btn.is-active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.5);
        }

        .hint-text {
            color: rgba(var(--accent-rgb), 0.5);
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: right;
            margin-top: 5px;
        }

        input[type="file"] { display: none; }

        /* Webcam feedback */
        #webcam-wrapper {
            position: absolute; 
            bottom: calc(30px + var(--safe-bottom));
            left: calc(30px + var(--safe-left));
            width: 280px;       
            height: 210px;
            border: 1px solid rgba(var(--accent-rgb), 0.5); 
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            border-radius: 4px;
            overflow: hidden; 
            opacity: 1;         
            pointer-events: none;
            z-index: 50;
            background: #000;
            transition: opacity 0.5s ease; 
        }
        
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }

        /* Debug info for gestures */
        #debug-info {
            position: absolute;
            bottom: 5px;
            left: 5px;
            color: rgba(var(--accent-rgb), 0.8);
            font-size: 10px;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
            pointer-events: none;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            /* 标题缩小 */
            h1 {
                font-size: 28px;
                letter-spacing: 3px;
                margin: 0;
            }

            /* UI层顶部内边距减小 */
            #ui-layer {
                padding-top: 15px;
            }

            /* 控制按钮组优化 */
            .controls-wrapper {
                top: 50px;
                right: 10px;
                gap: 6px;
            }

            .controls-panel {
                gap: 6px;
            }

            .controls-toggle {
                width: 34px;
                height: 34px;
            }

            .btn-group {
                flex-direction: column;
                gap: 6px;
            }

            .upload-btn {
                padding: 6px 12px;
                font-size: 8px;
                letter-spacing: 1px;
                min-width: 90px;
            }

            .hint-text {
                font-size: 7px;
                letter-spacing: 0.5px;
            }

            /* 摄像头区域大幅缩小 */
            #webcam-wrapper {
                bottom: 10px;
                left: 10px;
                width: 120px;
                height: 90px;
                border-width: 0.5px;
            }

            #debug-info {
                font-size: 7px;
                padding: 1px 3px;
                bottom: 2px;
                left: 2px;
            }
        }

        /* 超小屏幕进一步优化 */
        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
                letter-spacing: 2px;
            }

            #ui-layer {
                padding-top: 10px;
            }

            .controls-wrapper {
                top: 40px;
                right: 8px;
            }

            .controls-toggle {
                width: 32px;
                height: 32px;
            }

            .upload-btn {
                padding: 5px 10px;
                font-size: 7px;
                min-width: 80px;
            }

            .hint-text {
                font-size: 6px;
            }

            #webcam-wrapper {
                width: 100px;
                height: 75px;
                bottom: 8px;
                left: 8px;
            }

            #debug-info {
                font-size: 6px;
            }
        }

        /* 照片管理模态框样式 */
        @media (min-width: 769px) and (max-width: 1180px) {
            h1 {
                font-size: clamp(34px, 5vw, 48px);
                max-width: 66vw;
            }

            #ui-layer {
                padding-top: calc(26px + var(--safe-top));
            }

            .controls-wrapper {
                top: calc(92px + var(--safe-top));
                right: calc(20px + var(--safe-right));
            }

            .controls-panel {
                width: min(340px, calc(100vw - 40px - var(--safe-left) - var(--safe-right)));
                padding: 12px;
                border: 1px solid rgba(var(--accent-rgb), 0.28);
                border-radius: 8px;
                background: rgba(5, 13, 26, 0.78);
                box-sizing: border-box;
                backdrop-filter: blur(10px);
            }

            .btn-group {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                width: 100%;
                gap: 8px;
            }

            .btn-group:first-child > :last-child {
                grid-column: 1 / -1;
            }

            .upload-btn {
                width: 100%;
                min-width: 0;
                min-height: 44px;
                padding: 9px 14px;
            }

            .hint-text {
                width: 100%;
                text-align: left;
                line-height: 1.35;
            }

            #webcam-wrapper {
                width: 200px;
                height: 150px;
                bottom: calc(18px + var(--safe-bottom));
                left: calc(18px + var(--safe-left));
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: clamp(22px, 7vw, 32px);
                letter-spacing: clamp(1px, 0.8vw, 3px);
                max-width: calc(100vw - var(--safe-left) - var(--safe-right) - 32px);
            }

            #ui-layer {
                padding-top: calc(14px + var(--safe-top));
            }

            .controls-wrapper {
                top: calc(58px + var(--safe-top));
                right: calc(10px + var(--safe-right));
                max-height: calc(100dvh - 70px - var(--safe-top) - var(--safe-bottom));
            }

            .controls-panel {
                width: min(260px, calc(100vw - 20px - var(--safe-left) - var(--safe-right)));
                padding: 10px;
                border: 1px solid rgba(var(--accent-rgb), 0.28);
                border-radius: 8px;
                background: rgba(5, 13, 26, 0.78);
                box-sizing: border-box;
                backdrop-filter: blur(10px);
            }

            .controls-toggle {
                width: 44px;
                height: 44px;
            }

            .btn-group {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
                width: 100%;
            }

            .btn-group:first-child > :last-child {
                grid-column: 1 / -1;
            }

            .upload-btn {
                width: 100%;
                min-width: 0;
                min-height: 44px;
                padding: 8px 10px;
                font-size: 9px;
                letter-spacing: 1px;
                line-height: 1.25;
            }

            .hint-text {
                width: 100%;
                font-size: 8px;
                letter-spacing: 0.5px;
                text-align: left;
                line-height: 1.35;
            }

            #webcam-wrapper {
                bottom: calc(10px + var(--safe-bottom));
                left: calc(10px + var(--safe-left));
                width: clamp(108px, 27vw, 150px);
                aspect-ratio: 4 / 3;
                height: auto;
            }
        }

        @media (max-width: 480px) {
            #ui-layer {
                padding-top: calc(10px + var(--safe-top));
            }

            .controls-wrapper {
                top: calc(50px + var(--safe-top));
                right: calc(8px + var(--safe-right));
            }

            .upload-btn {
                padding: 7px 8px;
                font-size: 8px;
            }

            .hint-text {
                font-size: 7px;
            }

            #webcam-wrapper {
                width: clamp(96px, 28vw, 120px);
                height: auto;
                bottom: calc(8px + var(--safe-bottom));
                left: calc(8px + var(--safe-left));
            }
        }

        @media (pointer: coarse) {
            .controls-toggle,
            .upload-btn,
            .modal-close {
                min-height: 44px;
            }

            .controls-toggle {
                min-width: 44px;
            }
        }

        @media (hover: none) {
            .upload-btn:hover,
            .controls-toggle:hover,
            .modal-close:hover {
                box-shadow: none;
            }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            h1 {
                font-size: clamp(18px, 5vh, 26px);
            }

            #ui-layer {
                padding-top: calc(8px + var(--safe-top));
            }

            .controls-wrapper {
                top: calc(42px + var(--safe-top));
                max-height: calc(100dvh - 50px - var(--safe-top) - var(--safe-bottom));
            }

            .controls-panel {
                width: min(520px, calc(100vw - 20px - var(--safe-left) - var(--safe-right)));
                padding: 8px;
                border: 1px solid rgba(var(--accent-rgb), 0.28);
                border-radius: 8px;
                background: rgba(5, 13, 26, 0.78);
                box-sizing: border-box;
                backdrop-filter: blur(10px);
            }

            .btn-group {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                width: 100%;
                gap: 6px;
            }

            .greeting-group {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .upload-btn {
                width: 100%;
                min-width: 0;
                min-height: 44px;
                padding: 7px 8px;
                font-size: 8px;
            }

            .hint-text {
                display: none;
            }

            #webcam-wrapper {
                width: clamp(92px, 18vw, 130px);
            }
        }

        #photo-manager-modal {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background: rgba(5, 13, 26, 0.95);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left));
            touch-action: pan-y;
        }

        #photo-manager-modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid rgba(var(--accent-rgb), 0.6);
            border-radius: 8px;
            padding: 30px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(var(--accent-rgb), 0.3);
            width: min(100%, 1100px);
            box-sizing: border-box;
            overscroll-behavior: contain;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(var(--accent-rgb), 0.3);
        }

        .modal-title {
            color: var(--accent);
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 100;
        }

        .modal-close {
            background: rgba(var(--accent-rgb), 0.2);
            border: 1px solid rgba(var(--accent-rgb), 0.4);
            color: var(--accent);
            padding: 8px 16px;
            min-height: 44px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        .modal-close:hover {
            background: var(--accent);
            color: #000;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border: 1px solid rgba(var(--accent-rgb), 0.3);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .photo-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.4);
            transform: scale(1.05);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-item .delete-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(153, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .photo-item:hover .delete-overlay {
            opacity: 1;
        }

        .delete-icon {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
        }

        .photo-count {
            color: rgba(var(--accent-rgb), 0.7);
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                max-width: 95%;
            }

            .modal-title {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }

            .modal-close {
                padding: 6px 12px;
                font-size: 8px;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                padding: 15px;
            }

            .modal-title {
                font-size: 14px;
            }

            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 8px;
            }
        }

        @media (pointer: coarse) {
            .photo-item:hover {
                transform: none;
            }

            .photo-item .delete-overlay {
                opacity: 0.38;
            }

            .photo-item:hover .delete-overlay {
                opacity: 0.55;
            }
        }
    </style>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>
<body data-theme="birthday">

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading Memories</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <h1 id="title-heading">Happy Birthday</h1>

        <div class="controls-wrapper" id="controls-wrapper">
            <button class="controls-toggle" id="controls-toggle" type="button" aria-label="Show controls" title="Show controls">
                <span class="photo-icon" aria-hidden="true"></span>
            </button>

            <div class="controls-panel">
                <div class="btn-group">
                    <label class="upload-btn">

        function getFireworkViewportProfile() {
            const distance = Math.max(1, camera.position.z);
            const halfHeight = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * distance;
            const halfWidth = halfHeight * camera.aspect;
            const isPortrait = camera.aspect < FIREWORK_PORTRAIT_ASPECT;

            return {
                isPortrait,
                startY: camera.position.y - halfHeight + 1.5,
                targetMinY: camera.position.y + halfHeight * (isPortrait ? 0.08 : 0.12),
                targetMaxY: camera.position.y + halfHeight * (isPortrait ? 0.62 : 0.78),
                launchHalfWidth: Math.min(
                    CONFIG.firework.launchXRange,
                    halfWidth * (isPortrait ? 0.62 : 0.75)

                launchDepth: isPortrait ? 2.5 : 5,

                rocketSpeedMin: isPortrait ? 13 : 17,

        function resizeViewport() {
            if (!camera || !renderer) return;

            const { width, height } = getRenderSize();
            const pixelRatio = getRenderPixelRatio();

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            if (renderer.getPixelRatio() !== pixelRatio) {
                renderer.setPixelRatio(pixelRatio);
            }
            renderer.setSize(width, height, false);
            composer?.setPixelRatio(pixelRatio);
            composer?.setSize(width, height);
        }

        function worldToScreen(worldPos) {
            _candidateNdc.copy(worldPos).project(camera);
            return { x: _candidateNdc.x, y: _candidateNdc.y, z: _candidateNdc.z };
        }

        function isCandidateInView(screenPos) {
            return screenPos.z > -1
                && screenPos.z < 1
                && Math.abs(screenPos.x) <= CANDIDATE_VIEW_MARGIN
                && Math.abs(screenPos.y) <= CANDIDATE_VIEW_MARGIN;
        }

        function getCandidateScore(screenPos) {
            const horizontal = Math.abs(screenPos.x);
            const vertical = Math.max(0, Math.abs(screenPos.y) - CANDIDATE_VERTICAL_DEADBAND);
            return horizontal + vertical * CANDIDATE_VERTICAL_WEIGHT;
        }

        function getPhotoScreenMetrics(photoMesh) {
            photoMesh.getWorldPosition(_candidateWorldPos);
            const screenPos = worldToScreen(_candidateWorldPos);
            return {
                screenPos,
                inView: isCandidateInView(screenPos),
                score: getCandidateScore(screenPos)
            };
        }

        function updateCandidatePhoto() {
            let closest = null;
            let minScore = Infinity;

            particleSystem.forEach(p => {
                if (p.type !== 'PHOTO') return;
                if (p.visState !== 'VISIBLE') return;
                if (!p.mesh.visible) return;

                const metrics = getPhotoScreenMetrics(p.mesh);
                if (!metrics.inView) return;

                if (metrics.score < minScore) {
                    minScore = metrics.score;
                    closest = p.mesh;
                }
            });

            if (closest === null) {
                updateCandidateTarget(null);
                return;
            }

            updateCandidateTarget(closest);
        }

        function updateCandidateTarget(newTarget, bypassDebounce = false) {
            const now = performance.now();

            if (newTarget === null) {
                STATE.candidateTarget = null;
                return;
            }

            if (STATE.candidateTarget === newTarget) {
                return;
            }

            if (STATE.candidateTarget === null) {
                bypassDebounce = true;
            }

            if (!bypassDebounce && STATE.candidateTarget) {
                const oldMetrics = getPhotoScreenMetrics(STATE.candidateTarget);

                if (!oldMetrics.inView) {
                    bypassDebounce = true;
                } else {
                    if (now - lastCandidateSwitchTime < CANDIDATE_COOLDOWN) {
                        return;
                    }

                    const newMetrics = getPhotoScreenMetrics(newTarget);
                    const oldDist = oldMetrics.score;
                    const newDist = newMetrics.score;

                    if (newDist >= oldDist - CANDIDATE_SWITCH_THRESHOLD) {
                        return;
                    }
                }
            }

            STATE.candidateTarget = newTarget;
            lastCandidateSwitchTime = now;
        }

        function resetHandRotationTracking() {
            STATE.hand.filteredX = STATE.hand.x || 0;
            STATE.hand.lastRotateX = null;
        }

        function exitFocusMode() {
            STATE.mode = 'SCATTER';
            STATE.focusTarget = null;

        function updateRotationFromHand(currentHandX) {
            if (STATE.hand.lastRotateX === null) {
                STATE.hand.filteredX = currentHandX;
                STATE.hand.lastRotateX = currentHandX;
                return;
            }

            STATE.hand.filteredX = THREE.MathUtils.lerp(
                STATE.hand.filteredX,
                currentHandX,
                ROTATION_INPUT_SMOOTHING
            );

            let deltaX = STATE.hand.filteredX - STATE.hand.lastRotateX;
            STATE.hand.lastRotateX = STATE.hand.filteredX;

            const absDeltaX = Math.abs(deltaX);
            if (absDeltaX <= ROTATION_DELTA_DEADZONE) return;

            deltaX = Math.sign(deltaX) * THREE.MathUtils.clamp(
                absDeltaX - ROTATION_DELTA_DEADZONE,
                0,
                ROTATION_DELTA_MAX
            );

            STATE.rotation.targetY += deltaX * ROTATION_Y_SENSITIVITY;
        }

        function isVGesture(lm, handSize) {
            const wrist = lm[0];
            const distToWrist = point => Math.hypot(point.x - wrist.x, point.y - wrist.y);

            const indexDist = distToWrist(lm[8]);
            const middleDist = distToWrist(lm[12]);
            const ringDist = distToWrist(lm[16]);
            const pinkyDist = distToWrist(lm[20]);
            const fingerSpread = Math.hypot(lm[8].x - lm[12].x, lm[8].y - lm[12].y);

            return indexDist > handSize * 1.55
                && middleDist > handSize * 1.60
                && ringDist < handSize * 1.45
                && pinkyDist < handSize * 1.35
                && fingerSpread > handSize * 0.35;
        }

// wp/electronicminer wish you a Merry Christmas!

            camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);

        function createTextures() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,128,128);
            ctx.fillStyle = '#880000'; 
            ctx.beginPath();
            for(let i=-128; i<256; i+=32) {
                ctx.moveTo(i, 0); ctx.lineTo(i+32, 128); ctx.lineTo(i+16, 128); ctx.lineTo(i-16, 0);
            }
            ctx.fill();
            caneTexture = new THREE.CanvasTexture(canvas);
            caneTexture.wrapS = THREE.RepeatWrapping;
            caneTexture.wrapT = THREE.RepeatWrapping;
            caneTexture.repeat.set(3, 3);
        }
// wp/electronicminer wish you a Merry Christmas!
        // --- 新增：雪花系统 ---
        function createSnow() {
            const geometry = new THREE.BufferGeometry();

            const loader = new THREE.TextureLoader();
            // 圆点纹理 = 雪花；细长条纹理 = 彩屑（生日主题）
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const context = canvas.getContext('2d');
            context.fillStyle = 'white';
            context.beginPath();
            context.arc(16, 16, 16, 0, Math.PI * 2);
            context.fill();
            snowDotTexture = new THREE.CanvasTexture(canvas);

            const confettiCanvas = document.createElement('canvas');
            confettiCanvas.width = 16; confettiCanvas.height = 32;
            const confettiContext = confettiCanvas.getContext('2d');
            confettiContext.fillStyle = 'white';
            confettiContext.fillRect(4, 2, 8, 28);
            snowStripTexture = new THREE.CanvasTexture(confettiCanvas);

            const vertices = [];
            const velocities = [];
            const colors = [];
            // 彩屑配色：马卡龙色系，每片固定一色（雪模式关闭顶点色后呈纯白）
            const confettiPalette = [0xFF8FB8, 0xFFE9A8, 0xB388FF, 0x8ECAE6, 0xA8F0C6, 0xFFAFCC, 0xFFB37B, 0xFFFFFF];
            const _c = new THREE.Color();

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                const x = THREE.MathUtils.randFloatSpread(100);
                const y = THREE.MathUtils.randFloatSpread(60);
                const z = THREE.MathUtils.randFloatSpread(60);
                vertices.push(x, y, z);
                _c.setHex(confettiPalette[i % confettiPalette.length]);
                colors.push(_c.r, _c.g, _c.b);
                
                // 存储每个雪花的速度和摆动参数
                velocities.push(
                    Math.random() * 0.2 + 0.1, // fall speed
                    Math.random() * 0.05       // sway speed
                );
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('userData', new THREE.Float32BufferAttribute(velocities, 2));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                // 页面初始为生日主题：顶点色 + 彩屑条纹理；切回春节时换回圆点雪
                vertexColors: true,
                size: 0.55,
                map: snowStripTexture,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const snow = new THREE.Points(geometry, material);
            scene.add(snow);
            snowSystem = snow;
        }

        function updateSnow(dt, isFireworkMode = false) {
            if (!snowSystem) return;

            const materialLerp = Math.min(1, 6 * dt);
            // 彩屑模式：下落更慢、摇摆更大；换装前先把透明度降到 0
            const targetOpacity = snowPendingMode ? 0 : (isFireworkMode ? 0.025 : 0.8);
            const targetSize = snowPendingMode
                ? snowSystem.material.size
                : (isFireworkMode
                    ? (snowMode === 'confetti' ? 0.14 : 0.10)
                    : (snowMode === 'confetti' ? 0.55 : 0.4));

            // 淡出到位：换装（顶点色/纹理切换需要重编译材质）
            if (snowPendingMode && snowSystem.material.opacity < 0.03) {
                snowMode = snowPendingMode;
                snowPendingMode = null;
                const m = snowSystem.material;
                m.vertexColors = (snowMode === 'confetti');
                m.map = (snowMode === 'confetti') ? snowStripTexture : snowDotTexture;
                m.needsUpdate = true;
            }

            snowSystem.material.opacity = THREE.MathUtils.lerp(
                snowSystem.material.opacity,
                targetOpacity,
                materialLerp
            );
            snowSystem.material.size = THREE.MathUtils.lerp(
                snowSystem.material.size,
                targetSize,
                materialLerp
            );

            const fallScale = snowMode === 'confetti' ? 0.5 : 1;
            const swayScale = snowMode === 'confetti' ? 2.4 : 1;

            const positions = snowSystem.geometry.attributes.position.array;
            const userData = snowSystem.geometry.attributes.userData.array;

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                // Y轴下落（彩屑更飘逸）
                const fallSpeed = userData[i * 2];
                positions[i * 3 + 1] -= fallSpeed * fallScale;

                // X轴摇摆（彩屑飘荡更明显）
                const swaySpeed = userData[i * 2 + 1];
                positions[i * 3] += Math.sin(clock.elapsedTime * 2 + i) * swaySpeed * 0.1 * swayScale;

                // 循环重置
                if (positions[i * 3 + 1] < -30) {
                    positions[i * 3 + 1] = 30;
                    positions[i * 3] = THREE.MathUtils.randFloatSpread(100);
                    positions[i * 3 + 2] = THREE.MathUtils.randFloatSpread(60);
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
        }

        const FIREWORK_VS = `
            attribute vec3 aColor; attribute float aAlpha; attribute float aSize; attribute float aPhase;
            varying vec3 vColor; varying float vAlpha; varying float vPhase;
            void main() {
                vColor = aColor; vAlpha = aAlpha; vPhase = aPhase;
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = aSize * (600.0 / max(-mv.z, 0.001));
                gl_Position = projectionMatrix * mv;
            }`;
        const FIREWORK_FS = `
            precision highp float;
            uniform float uTime;
            varying vec3 vColor; varying float vAlpha; varying float vPhase;
            void main() {
                vec2 pc = gl_PointCoord - 0.5;
                float r2 = dot(pc, pc);
                if (r2 > 0.25) discard;
                float r = sqrt(r2) * 2.0;
                float softGlow = pow(1.0 - r, 3.0) * 0.8;
                float core = pow(1.0 - r, 12.0) * 1.0;
                float intensity = min(1.0, (softGlow + core)) * vAlpha;
                if (vPhase >= 0.0) {
                    float blink = step(0.1, sin(uTime * 45.0 + vPhase * 62.8));
                    intensity *= mix(0.3, 1.0, blink);
                }
                gl_FragColor = vec4(vColor * 1.4, intensity);
            }`;

        function getGlowTexture() {
            if (glowTextureCache) return glowTextureCache;

            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0.0, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(0.18, 'rgba(255,220,140,0.34)');
            gradient.addColorStop(0.58, 'rgba(255,160,80,0.08)');
            gradient.addColorStop(1.0, 'rgba(255,160,80,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);

            glowTextureCache = new THREE.CanvasTexture(canvas);
            return glowTextureCache;
        }

        function getSmokeTexture() {
            if (smokeTextureCache) return smokeTextureCache;

            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 6, 64, 64, 64);
            gradient.addColorStop(0.0, 'rgba(210,220,230,0.38)');
            gradient.addColorStop(0.34, 'rgba(190,205,220,0.14)');
            gradient.addColorStop(0.76, 'rgba(170,185,205,0.04)');
            gradient.addColorStop(1.0, 'rgba(170,185,205,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);

            smokeTextureCache = new THREE.CanvasTexture(canvas);
            return smokeTextureCache;
        }

        class FireworkResidue {
            constructor(position, color, sceneRef) {
                this.position = position.clone();
                this.sceneRef = sceneRef;
                this.life = FIREWORK_RESIDUE_LIFE;
                this.age = 0;
                this.alive = true;

                const glowColor = new THREE.Color(color);
                this.glowMaterial = new THREE.SpriteMaterial({
                    map: getGlowTexture(),
                    color: glowColor,
                    transparent: true,
                    opacity: FIREWORK_AFTERGLOW_OPACITY,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: false
                });
                this.glow = new THREE.Sprite(this.glowMaterial);
                this.glow.position.copy(this.position);
                const glowSize = THREE.MathUtils.randFloat(5.0, 8.0);
                this.glow.userData.baseSize = glowSize;
                this.glow.scale.setScalar(glowSize);
                this.glow.renderOrder = 997;
                sceneRef.add(this.glow);

                this.smokeMaterial = new THREE.SpriteMaterial({
                    map: getSmokeTexture(),
                    color: 0x9fb4c8,
                    transparent: true,
                    opacity: FIREWORK_SMOKE_OPACITY,
                    blending: THREE.NormalBlending,
                    depthWrite: false,
                    depthTest: false
                });
                this.smoke = new THREE.Sprite(this.smokeMaterial);
                this.smoke.position.copy(this.position);
                this.smoke.position.y -= THREE.MathUtils.randFloat(0.2, 0.8);
                this.smoke.position.x += THREE.MathUtils.randFloatSpread(1.2);
                this.smoke.position.z += THREE.MathUtils.randFloatSpread(1.2);
                const smokeSize = THREE.MathUtils.randFloat(7.0, 11.0);
                this.smoke.userData.baseSize = smokeSize;
                this.smoke.scale.setScalar(smokeSize);
                this.smoke.material.rotation = Math.random() * Math.PI;
                this.smoke.renderOrder = 996;
                sceneRef.add(this.smoke);
            }

            update(dt) {
                this.age += dt;
                const t = THREE.MathUtils.clamp(this.age / this.life, 0, 1);
                const fade = Math.pow(1 - t, 1.7);

                this.glow.material.opacity = FIREWORK_AFTERGLOW_OPACITY * fade;
                const glowScale = this.glow.userData.baseSize * THREE.MathUtils.lerp(1.0, 1.35, t);
                this.glow.scale.setScalar(glowScale);

                this.smoke.material.opacity = FIREWORK_SMOKE_OPACITY * fade;
                this.smoke.position.y += dt * 0.45;
                this.smoke.material.rotation += dt * 0.18;
                const smokeScale = this.smoke.userData.baseSize * THREE.MathUtils.lerp(1.0, 1.45, t);
                this.smoke.scale.setScalar(smokeScale);

                if (this.age >= this.life) {
                    this.alive = false;
                }
            }

            dispose(sceneRef) {
                sceneRef.remove(this.glow);
                sceneRef.remove(this.smoke);
                this.glowMaterial.dispose();
                this.smokeMaterial.dispose();
            }
        }

        class Explosion {
            static TYPE_TABLE = {
                PEONY:         { count: 500,  gravity: 4.0, drag: 0.965, speedMin: 12, speedRange: 24, life: 3.0, baseSize: 0.80, sparkle: 0.05, trailLife: 0.55 },
                CHRYSANTHEMUM: { count: 600,  gravity: 3.0, drag: 0.955, speedMin: 10, speedRange: 20, life: 3.8, baseSize: 0.70, sparkle: 0.40, trailLife: 1.20 },
                WILLOW:        { count: 400,  gravity: 1.2, drag: 0.945, speedMin: 6,  speedRange: 14, life: 6.5, baseSize: 0.60, sparkle: 1.00, trailLife: 2.20 },
                PALM:          { count: 300,  gravity: 5.5, drag: 0.930, speedMin: 15, speedRange: 20, life: 3.8, baseSize: 0.85, sparkle: 0.10, trailLife: 1.30 },
                CROSSETTE:     { count: 380,  gravity: 4.0, drag: 0.965, speedMin: 12, speedRange: 24, life: 2.6, baseSize: 0.82, sparkle: 0.10, trailLife: 0.65 },
                STROBE:        { count: 450,  gravity: 2.2, drag: 0.975, speedMin: 10, speedRange: 20, life: 4.8, baseSize: 0.72, sparkle: 1.00, trailLife: 0.60 },
                RING:          { count: 380,  gravity: 2.5, drag: 0.975, speedMin: 14, speedRange: 14, life: 3.2, baseSize: 0.75, sparkle: 0.10, trailLife: 0.50 },
                PISTIL:        { count: 600,  gravity: 4.0, drag: 0.965, speedMin: 12, speedRange: 24, life: 3.2, baseSize: 0.80, sparkle: 0.05, trailLife: 0.60 },
            };
            static SUB_CONFIG = { count: 100, gravity: 4.0, drag: 0.96, speedMin: 4, speedRange: 5, life: 1.2, baseSize: 0.55, sparkle: 0.10, trailLife: 0.30 };
            static TRAIL_MAX = 4000;

            constructor(position, color, type, sceneRef, isSub = false, profile = null) {
                this.position = position.clone();
                this.type = type;
                this.sceneRef = sceneRef;
                this.isSub = isSub;
                this.profile = profile;
                this.cfg = isSub ? Explosion.SUB_CONFIG : (Explosion.TYPE_TABLE[type] || Explosion.TYPE_TABLE.PEONY);
                this.maxLife = this.cfg.life;
                this.life = this.maxLife;
                this.alive = true;
                this.secondStageTriggered = false;
                this.subExplosions = [];
                this._initParticles();
                if (!isSub && this.cfg.trailLife > 0) this._initTrails();
            }

            _initParticles() {
                const cfg = this.cfg;
                const particleScale = this.profile?.explosionParticleScale || 1;
                const count = Math.max(80, Math.round(cfg.count * particleScale));
                this.count = count;
                const pos = new Float32Array(count * 3);
                const col = new Float32Array(count * 3);
                const alp = new Float32Array(count);
                const siz = new Float32Array(count);
                const pha = new Float32Array(count);
                this.velocities = [];
                this.baseSizes = new Float32Array(count);

                const palette = CONFIG.firework.colors;
                const colorCount = this.isSub ? 1 : THREE.MathUtils.randInt(CONFIG.firework.palettePerExplosionMin, CONFIG.firework.palettePerExplosionMax);
                const selectedColors = [];
                for (let c = 0; c < colorCount; c++) {
                    selectedColors.push(new THREE.Color(palette[Math.floor(Math.random() * palette.length)]));
                }
                const pistilColor = (this.type === 'PISTIL')
                    ? new THREE.Color(palette[Math.floor(Math.random() * palette.length)])
                    : null;
                const pistilStart = (this.type === 'PISTIL') ? Math.floor(count * 0.7) : count;

                for (let i = 0; i < count; i++) {
                    pos[i * 3] = this.position.x;
                    pos[i * 3 + 1] = this.position.y;
                    pos[i * 3 + 2] = this.position.z;

                    const isPistilCore = i >= pistilStart;
                    const speed = isPistilCore
                        ? (cfg.speedMin * 0.45 + Math.random() * cfg.speedRange * 0.3)
                        : (cfg.speedMin + Math.random() * cfg.speedRange);
                    const velocity = this._getDirection(i, count).normalize().multiplyScalar(speed);
                    velocity.x *= this.profile?.explosionHorizontalScale || 1;
                    this.velocities.push(velocity);

                    const baseCol = isPistilCore ? pistilColor : selectedColors[i % colorCount];
                    const hsl = {};
                    baseCol.getHSL(hsl);
                    const h = (hsl.h + (Math.random() - 0.5) * (30 / 360) + 1) % 1;
                    const s = THREE.MathUtils.clamp(hsl.s + (Math.random() - 0.5) * 0.15, 0.6, 1);
                    const l = 0.55 + Math.random() * 0.25;
                    const pc = new THREE.Color().setHSL(h, s, l);
                    col[i * 3] = pc.r; col[i * 3 + 1] = pc.g; col[i * 3 + 2] = pc.b;

                    alp[i] = 1.0;
                    const sizeJitter = 0.7 + Math.random() * 0.6;
                    this.baseSizes[i] = cfg.baseSize * sizeJitter * (isPistilCore ? 0.85 : 1.0);
                    siz[i] = this.baseSizes[i];
                    pha[i] = Math.random() < cfg.sparkle ? Math.random() * Math.PI * 2 : -1.0;
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
                geo.setAttribute('aAlpha', new THREE.BufferAttribute(alp, 1));
                geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(pha, 1));
                geo.attributes.position.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aAlpha.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aSize.setUsage(THREE.DynamicDrawUsage);

                this.material = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 } },
                    vertexShader: FIREWORK_VS,
                    fragmentShader: FIREWORK_FS,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: false
                });

                this.points = new THREE.Points(geo, this.material);
                this.points.renderOrder = 1000;
                this.sceneRef.add(this.points);
            }

            _initTrails() {
                const n = Explosion.TRAIL_MAX;
                this.trailIdx = 0;
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
                geo.setAttribute('aColor', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
                geo.setAttribute('aAlpha', new THREE.BufferAttribute(new Float32Array(n), 1));
                geo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(n), 1));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(new Float32Array(n).fill(-1), 1));
                geo.attributes.position.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aColor.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aAlpha.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aSize.setUsage(THREE.DynamicDrawUsage);
                this.trailPoints = new THREE.Points(geo, this.material);
                this.trailPoints.renderOrder = 999;
                this.sceneRef.add(this.trailPoints);
            }

            _getDirection(i, count) {
                const d = new THREE.Vector3().randomDirection();
                switch (this.type) {
                    case 'RING': {
                        const a = (i / count) * Math.PI * 2;
                        return new THREE.Vector3(Math.cos(a), THREE.MathUtils.randFloatSpread(0.08), Math.sin(a));
                    }
                    case 'PALM': {
                        d.y = Math.abs(d.y) * 0.4 + 0.55;
                        return d;
                    }
                    case 'WILLOW': {
                        d.y = Math.abs(d.y) * 0.25 + 0.05;
                        return d;
                    }
                    case 'CROSSETTE': {
                        const arms = 8;
                        const arm = i % arms;
                        const armAngle = (arm / arms) * Math.PI * 2;
                        const lift = THREE.MathUtils.randFloatSpread(0.25);
                        return new THREE.Vector3(Math.cos(armAngle), lift, Math.sin(armAngle));
                    }
                    default:
                        return d;
                }
            }

            update(dt) {
                if (!this.alive) return;
                this.life -= dt;
                const progress = Math.max(0, this.life / this.maxLife);

                if (this.life <= 0 && this.subExplosions.every(se => !se.alive)) {
                    this.alive = false;
                    return;
                }

                this.material.uniforms.uTime.value += dt;
                const pos = this.points.geometry.attributes.position.array;
                const alp = this.points.geometry.attributes.aAlpha.array;
                const siz = this.points.geometry.attributes.aSize.array;
                const gravity = this.cfg.gravity;
                const drag = this.cfg.drag;

                for (let i = 0; i < this.count; i++) {
                    const v = this.velocities[i];
                    v.y -= gravity * dt;
                    v.x += THREE.MathUtils.randFloatSpread(0.2);
                    v.z += THREE.MathUtils.randFloatSpread(0.2);
                    v.multiplyScalar(drag);
                    pos[i * 3] += v.x * dt;
                    pos[i * 3 + 1] += v.y * dt;
                    pos[i * 3 + 2] += v.z * dt;
                    alp[i] = Math.pow(progress, 1.5);
                    siz[i] = this.baseSizes[i] * (0.6 + 0.4 * progress);
                }

                this.points.geometry.attributes.position.needsUpdate = true;
                this.points.geometry.attributes.aAlpha.needsUpdate = true;
                this.points.geometry.attributes.aSize.needsUpdate = true;

                if (this.trailPoints && progress > 0) this._updateTrails(dt, pos, alp, siz);

                if (this.type === 'CROSSETTE' && !this.secondStageTriggered && (1 - progress) >= 0.45) {
                    this.secondStageTriggered = true;
                    const palette = CONFIG.firework.colors;
                    const arms = 8;
                    for (let k = 0; k < arms; k++) {
                        const ri = Math.floor((k / arms) * this.count + Math.random() * (this.count / arms));
                        const p = new THREE.Vector3(pos[ri * 3], pos[ri * 3 + 1], pos[ri * 3 + 2]);
                        this.subExplosions.push(new Explosion(
                            p,
                            palette[Math.floor(Math.random() * palette.length)],
                            'PEONY',
                            this.sceneRef,
                            true,
                            this.profile
                        ));
                    }
                }

                this.subExplosions.forEach(se => se.update(dt));
            }

            _updateTrails(dt, pos, alp, siz) {
                const tGeo = this.trailPoints.geometry;
                const tPos = tGeo.attributes.position.array;
                const tCol = tGeo.attributes.aColor.array;
                const tAlp = tGeo.attributes.aAlpha.array;
                const tSiz = tGeo.attributes.aSize.array;
                const pCol = this.points.geometry.attributes.aColor.array;
                const n = Explosion.TRAIL_MAX;
                const trailLife = this.cfg.trailLife;

                for (let i = 0; i < n; i++) tAlp[i] = Math.max(0, tAlp[i] - dt / trailLife);

                for (let i = 0; i < this.count; i += 4) {
                    if (alp[i] <= 0.05) continue;
                    const idx = this.trailIdx;
                    tPos[idx * 3] = pos[i * 3];
                    tPos[idx * 3 + 1] = pos[i * 3 + 1];
                    tPos[idx * 3 + 2] = pos[i * 3 + 2];
                    tCol[idx * 3] = pCol[i * 3] * 0.7;
                    tCol[idx * 3 + 1] = pCol[i * 3 + 1] * 0.7;
                    tCol[idx * 3 + 2] = pCol[i * 3 + 2] * 0.7;
                    tAlp[idx] = alp[i] * 0.7;
                    tSiz[idx] = siz[i] * 1.2;
                    this.trailIdx = (this.trailIdx + 1) % n;
                }

                tGeo.attributes.position.needsUpdate = true;
                tGeo.attributes.aColor.needsUpdate = true;
                tGeo.attributes.aAlpha.needsUpdate = true;
                tGeo.attributes.aSize.needsUpdate = true;
            }

            dispose(sceneRef) {
                sceneRef.remove(this.points);
                this.points.geometry.dispose();
                this.material.dispose();
                if (this.trailPoints) {
                    sceneRef.remove(this.trailPoints);
                    this.trailPoints.geometry.dispose();
                }
                this.subExplosions.forEach(se => se.dispose(sceneRef));
            }
        }

        class Rocket {
            static TRAIL_LEN = 80;
            static SPARK_COUNT = 25;

            constructor(startPos, targetHeight, color, type, sceneRef, profile) {
                this.position = startPos.clone();
                this.targetHeight = targetHeight;
                this.color = color;
                this.type = type;
                this.sceneRef = sceneRef;
                this.profile = profile;
                this.alive = true;
                this.velocity = new THREE.Vector3(
                    THREE.MathUtils.randFloatSpread(profile.rocketDrift),
                    THREE.MathUtils.randFloat(profile.rocketSpeedMin, profile.rocketSpeedMax),
                    THREE.MathUtils.randFloatSpread(profile.rocketDrift)
                );

                const sparkCount = Rocket.SPARK_COUNT;
                const sparkGeo = new THREE.BufferGeometry();
                const sparkPos = new Float32Array(sparkCount * 3);
                const sparkCol = new Float32Array(sparkCount * 3);
                const sparkAlp = new Float32Array(sparkCount);
                const sparkSiz = new Float32Array(sparkCount);
                const sparkPha = new Float32Array(sparkCount);
                this.sparkVelocities = [];

                const c = new THREE.Color(color);
                for (let i = 0; i < sparkCount; i++) {
                    sparkPos[i * 3] = this.position.x;
                    sparkPos[i * 3 + 1] = this.position.y;
                    sparkPos[i * 3 + 2] = this.position.z;
                    sparkCol[i * 3] = c.r;
                    sparkCol[i * 3 + 1] = c.g;
                    sparkCol[i * 3 + 2] = c.b;
                    sparkAlp[i] = 0.6 + Math.random() * 0.3;
                    sparkSiz[i] = 0.25 + Math.random() * 0.3;
                    sparkPha[i] = Math.random() * Math.PI * 2;
                    this.sparkVelocities.push(new THREE.Vector3(
                        THREE.MathUtils.randFloatSpread(2),
                        THREE.MathUtils.randFloatSpread(2) - 1.5,
                        THREE.MathUtils.randFloatSpread(2)
                    ));
                }

                sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
                sparkGeo.setAttribute('aColor', new THREE.BufferAttribute(sparkCol, 3));
                sparkGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sparkAlp, 1));
                sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(sparkSiz, 1));
                sparkGeo.setAttribute('aPhase', new THREE.BufferAttribute(sparkPha, 1));
                sparkGeo.attributes.position.setUsage(THREE.DynamicDrawUsage);
                sparkGeo.attributes.aAlpha.setUsage(THREE.DynamicDrawUsage);

                this.sparkMaterial = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 } },
                    vertexShader: FIREWORK_VS,
                    fragmentShader: FIREWORK_FS,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: false
                });
                this.sparks = new THREE.Points(sparkGeo, this.sparkMaterial);
                this.sparks.renderOrder = 1001;
                sceneRef.add(this.sparks);

                this.headMaterial = new THREE.SpriteMaterial({
                    map: getGlowTexture(),
                    color: c,
                    transparent: true,
                    opacity: 0.95,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: false
                });
                this.head = new THREE.Sprite(this.headMaterial);
                this.head.position.copy(this.position);
                this.head.userData.baseScale = profile.isPortrait ? 1.35 : 1.05;
                this.head.scale.setScalar(this.head.userData.baseScale);
                this.head.renderOrder = 1002;
                sceneRef.add(this.head);

                this.trailIdx = 0;
                this.trailBuf = new Float32Array(Rocket.TRAIL_LEN * 3);
                this.trailColBuf = new Float32Array(Rocket.TRAIL_LEN * 3);
                this.trailAlpBuf = new Float32Array(Rocket.TRAIL_LEN);
                this.trailSizBuf = new Float32Array(Rocket.TRAIL_LEN);
                this.trailPhaBuf = new Float32Array(Rocket.TRAIL_LEN).fill(-1);
                for (let i = 0; i < Rocket.TRAIL_LEN; i++) {
                    this.trailColBuf[i * 3] = c.r;
                    this.trailColBuf[i * 3 + 1] = c.g;
                    this.trailColBuf[i * 3 + 2] = c.b;
                    this.trailSizBuf[i] = (0.7 + (i / Rocket.TRAIL_LEN) * 0.45) * profile.trailScale;
                }

                this.trailGeometry = new THREE.BufferGeometry();
                this.trailGeometry.setAttribute('position', new THREE.BufferAttribute(this.trailBuf, 3));
                this.trailGeometry.setAttribute('aColor', new THREE.BufferAttribute(this.trailColBuf, 3));
                this.trailGeometry.setAttribute('aAlpha', new THREE.BufferAttribute(this.trailAlpBuf, 1));
                this.trailGeometry.setAttribute('aSize', new THREE.BufferAttribute(this.trailSizBuf, 1));
                this.trailGeometry.setAttribute('aPhase', new THREE.BufferAttribute(this.trailPhaBuf, 1));
                this.trailGeometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
                this.trailGeometry.attributes.aAlpha.setUsage(THREE.DynamicDrawUsage);
                this.trailGeometry.setDrawRange(0, 0);

                this.trailMaterial = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 } },
                    vertexShader: FIREWORK_VS,
                    fragmentShader: FIREWORK_FS,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: false
                });
                this.trail = new THREE.Points(this.trailGeometry, this.trailMaterial);
                this.trail.renderOrder = 1000;
                sceneRef.add(this.trail);
            }

            update(dt) {
                this.position.addScaledVector(this.velocity, dt);

                this.head.position.copy(this.position);
                const headPulse = this.head.userData.baseScale * (0.92 + Math.sin(clock.elapsedTime * 28) * 0.08);
                this.head.scale.setScalar(headPulse);

                this.sparkMaterial.uniforms.uTime.value += dt;
                this.trailMaterial.uniforms.uTime.value += dt;

                const sPos = this.sparks.geometry.attributes.position.array;
                const sAlp = this.sparks.geometry.attributes.aAlpha.array;
                for (let i = 0; i < Rocket.SPARK_COUNT; i++) {
                    const sv = this.sparkVelocities[i];
                    sPos[i * 3] += sv.x * dt;
                    sPos[i * 3 + 1] += sv.y * dt;
                    sPos[i * 3 + 2] += sv.z * dt;
                    sAlp[i] = Math.max(0, sAlp[i] - dt * 2.0);
                }
                this.sparks.geometry.attributes.position.needsUpdate = true;
                this.sparks.geometry.attributes.aAlpha.needsUpdate = true;

                const idx = this.trailIdx % Rocket.TRAIL_LEN;
                this.trailBuf[idx * 3] = this.position.x + THREE.MathUtils.randFloatSpread(0.1);
                this.trailBuf[idx * 3 + 1] = this.position.y;
                this.trailBuf[idx * 3 + 2] = this.position.z + THREE.MathUtils.randFloatSpread(0.1);
                this.trailAlpBuf[idx] = 1.0;
                this.trailIdx++;

                for (let i = 0; i < Rocket.TRAIL_LEN; i++) {
                    this.trailAlpBuf[i] = Math.max(0, this.trailAlpBuf[i] - dt * 1.0);
                }

                this.trailGeometry.attributes.position.needsUpdate = true;
                this.trailGeometry.attributes.aAlpha.needsUpdate = true;
                this.trailGeometry.setDrawRange(0, Math.min(this.trailIdx, Rocket.TRAIL_LEN));
            }

            dispose(sceneRef) {
                sceneRef.remove(this.sparks);
                sceneRef.remove(this.trail);
                sceneRef.remove(this.head);
                this.sparks.geometry.dispose();
                this.sparkMaterial.dispose();
                this.trailGeometry.dispose();
                this.trailMaterial.dispose();
                this.headMaterial.dispose();
            }
        }

        class FireworkSystem {
            constructor(sceneRef) {
                this.sceneRef = sceneRef;
                this.rockets = [];
                this.explosions = [];
                this.residues = [];
                this.lastLaunchTime = 0;
                this.comboQueue = [];
                this.nextComboTime = 0;
            }

            update(dt, currentTime, isActive) {
                const profile = getFireworkViewportProfile();
                const activeFireworkCount = this.explosions.length + this.rockets.length;
                const canAddFirework = activeFireworkCount < profile.maxExplosions
                    && this.rockets.length < profile.maxRockets;

                if (isActive && canAddFirework) {
                    if (currentTime >= this.nextComboTime) {
                        const isCombo = Math.random() < profile.comboChance;
                        if (isCombo) {
                            this.launchCombo(profile);
                        } else {
                            this.launchRocket(profile);
                        }
                        const interval = THREE.MathUtils.randInt(profile.intervalMin, profile.intervalMax);
                        this.nextComboTime = currentTime + interval;
                    }
                }

                this.rockets = this.rockets.filter(rocket => {
                    rocket.update(dt);
                    if (rocket.position.y >= rocket.targetHeight) {
                        this.createExplosion(rocket);
                        rocket.dispose(this.sceneRef);
                        return false;
                    }
                    return rocket.alive;
                });

                this.explosions = this.explosions.filter(explosion => {
                    explosion.update(dt);
                    if (!explosion.alive) {
                        explosion.dispose(this.sceneRef);
                        return false;
                    }
                    return true;
                });

                this.residues = this.residues.filter(residue => {
                    residue.update(dt);
                    if (!residue.alive) {
                        residue.dispose(this.sceneRef);
                        return false;
                    }
                    return true;
                });
            }

            addRocket(x, targetHeight, color, type, profile, z = null) {
                if (this.rockets.length >= profile.maxRockets) return;
                if (this.explosions.length + this.rockets.length >= profile.maxExplosions) return;

                const clampedX = THREE.MathUtils.clamp(x, -profile.launchHalfWidth, profile.launchHalfWidth);
                const depth = z ?? THREE.MathUtils.randFloatSpread(profile.launchDepth * 2);
                const startPos = new THREE.Vector3(clampedX, profile.startY, depth);
                const clampedTarget = THREE.MathUtils.clamp(
                    targetHeight,
                    profile.targetMinY,
                    profile.targetMaxY
                );
                this.rockets.push(new Rocket(
                    startPos,
                    clampedTarget,
                    color,
                    type,
                    this.sceneRef,
                    profile
                ));
            }

            launchRocket(profile = getFireworkViewportProfile()) {
                const x = THREE.MathUtils.randFloatSpread(profile.launchHalfWidth * 2);
                const targetHeight = THREE.MathUtils.randFloat(profile.targetMinY, profile.targetMaxY);
                const color = CONFIG.firework.colors[Math.floor(Math.random() * CONFIG.firework.colors.length)];
                const type = CONFIG.firework.types[Math.floor(Math.random() * CONFIG.firework.types.length)];
                this.addRocket(x, targetHeight, color, type, profile);
            }

            launchCombo(profile = getFireworkViewportProfile()) {
                const palette = CONFIG.firework.colors;
                const types = CONFIG.firework.types;

                if (profile.isPortrait) {
                    const count = THREE.MathUtils.randInt(2, 3);
                    const centerX = THREE.MathUtils.randFloatSpread(profile.launchHalfWidth * 0.7);
                    const spacing = Math.max(1.3, profile.launchHalfWidth * 0.32);

                    for (let i = 0; i < count; i++) {
                        const x = centerX + (i - (count - 1) / 2) * spacing;
                        const heightProgress = count === 1 ? 0.5 : i / (count - 1);
                        const targetHeight = THREE.MathUtils.lerp(
                            profile.targetMinY,
                            profile.targetMaxY,
                            0.25 + heightProgress * 0.6
                        );
                        const color = palette[Math.floor(Math.random() * palette.length)];
                        const type = types[Math.floor(Math.random() * types.length)];
                        this.addRocket(x, targetHeight, color, type, profile);
                    }
                    return;
                }

                const comboType = Math.floor(Math.random() * 4);

                switch (comboType) {
                    case 0: {
                        const count = THREE.MathUtils.randInt(3, 5);
                        const centerX = THREE.MathUtils.randFloatSpread(12);
                        for (let i = 0; i < count; i++) {
                            const x = centerX + (i - (count - 1) / 2) * THREE.MathUtils.randFloat(2, 4);
                            const targetHeight = THREE.MathUtils.randFloat(10, 18);
                            const color = palette[Math.floor(Math.random() * palette.length)];
                            const type = types[Math.floor(Math.random() * types.length)];
                            this.addRocket(x, targetHeight, color, type, profile);
                        }
                        break;
                    }
                    case 1: {
                        const color1 = palette[Math.floor(Math.random() * palette.length)];
                        const color2 = palette[Math.floor(Math.random() * palette.length)];
                        for (let i = 0; i < 3; i++) {
                            const x = THREE.MathUtils.randFloatSpread(16);
                            const targetHeight = THREE.MathUtils.randFloat(10, 16);
                            this.addRocket(x, targetHeight, color1, 'WILLOW', profile);
                        }
                        for (let i = 0; i < 2; i++) {
                            const x = THREE.MathUtils.randFloatSpread(16);
                            const targetHeight = THREE.MathUtils.randFloat(14, 20);
                            this.addRocket(x, targetHeight, color2, 'PEONY', profile);
                        }
                        break;
                    }
                    case 2: {
                        const sharedColor = palette[Math.floor(Math.random() * palette.length)];
                        const heights = [8, 14, 20];
                        for (let i = 0; i < 3; i++) {
                            const x = THREE.MathUtils.randFloatSpread(8);
                            this.addRocket(x, heights[i], sharedColor, 'CHRYSANTHEMUM', profile);
                        }
                        break;
                    }
                    case 3: {
                        for (let i = 0; i < 4; i++) {
                            const angle = (i / 4) * Math.PI * 2;
                            const radius = THREE.MathUtils.randFloat(5, 10);
                            const x = Math.cos(angle) * radius;
                            const z = Math.sin(angle) * radius;
                            const targetHeight = THREE.MathUtils.randFloat(12, 20);
                            const color = palette[Math.floor(Math.random() * palette.length)];
                            const type = types[Math.floor(Math.random() * types.length)];
                            this.addRocket(x, targetHeight, color, type, profile, z);
                        }
                        break;
                    }
                }
            }

            createExplosion(rocket) {
                this.explosions.push(new Explosion(
                    rocket.position,
                    rocket.color,
                    rocket.type,
                    this.sceneRef,
                    false,
                    rocket.profile
                ));
                const residueLimit = rocket.profile.isPortrait ? 6 : FIREWORK_RESIDUE_MAX;
                if (this.residues.length >= residueLimit) {
                    const oldest = this.residues.shift();
                    oldest.dispose(this.sceneRef);
                }
                this.residues.push(new FireworkResidue(rocket.position, rocket.color, this.sceneRef));
            }

            dispose() {
                this.rockets.forEach(r => r.dispose(this.sceneRef));
                this.explosions.forEach(e => e.dispose(this.sceneRef));
                this.residues.forEach(r => r.dispose(this.sceneRef));
                this.rockets = [];
                this.explosions = [];
                this.residues = [];
            }
        }

        const _pv3 = new THREE.Vector3();
        class Particle {
            constructor(mesh, type, isDust = false, theme = 'common') {
                this.mesh = mesh;
                this.type = type;
                this.isDust = isDust;
                // 主题归属：'common' 两个主题共用，'christmas'/'birthday' 各自专属
                this.theme = theme;
                // 主题切换驱动的目标显隐，独立于烟花用的 visState
                this.themeVisible = true;

                this.posTree = new THREE.Vector3();
                this.posScatter = new THREE.Vector3();
                this.baseScale = mesh.scale.x;
                this.visState = 'VISIBLE';
                this.prevMode = null;
                this.fireworkPulseDone = false;

                const speedMult = (type === 'PHOTO') ? 0.3 : 2.0;

                this.spinSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult
                );

                this.calculatePositions();
            }

            calculatePositions() {
                if (this.type === 'PHOTO') {
                    this.posTree.set(0, 0, 0); 
                    const rScatter = 8 + Math.random()*12;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(
                        rScatter * Math.sin(phi) * Math.cos(theta),
                        rScatter * Math.sin(phi) * Math.sin(theta),
                        rScatter * Math.cos(phi)
                    );
                    return;
                }

                const h = CONFIG.particles.treeHeight;
                const halfH = h / 2;
                let t = Math.random(); 
                t = Math.pow(t, 0.8); 
                const y = (t * h) - halfH;
                
                let rMax = CONFIG.particles.treeRadius * (1.0 - t); 
                if (rMax < 0.5) rMax = 0.5;

                const angle = t * 50 * Math.PI + Math.random() * Math.PI; 
                const r = rMax * (0.8 + Math.random() * 0.4); 
                this.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);

                let rScatter = this.isDust ? (12 + Math.random()*20) : (8 + Math.random()*12);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
