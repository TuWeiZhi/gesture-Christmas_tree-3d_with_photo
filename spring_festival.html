<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Luxury Tree - Spring Festival Edition</title>
    <style>
        /* 修改背景为深色渐变，不再是纯黑 */
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #0f2027 0%, #203a43 50%, #2c5364 100%); 
            background-color: #050d1a; /* Fallback */
            font-family: 'Times New Roman', serif; 
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; 
            align-items: center;
            padding-top: 40px;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }
        
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Loading */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #050d1a; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        .loader-text {
            color: #ff4500; font-size: 14px; letter-spacing: 4px; margin-top: 20px;
            text-transform: uppercase; font-weight: 100;
        }
        .spinner {
            width: 40px; height: 40px; border: 1px solid rgba(255, 69, 0, 0.2);
            border-top: 1px solid #ff4500; border-radius: 50%; 
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Typography */
        h1 { 
            color: #fceea7; font-size: 56px; margin: 0; font-weight: 400; 
            letter-spacing: 6px; 
            text-shadow: 0 0 50px rgba(252, 238, 167, 0.6); 
            background: linear-gradient(to bottom, #fff, #ff4500);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Cinzel', 'Times New Roman', serif;
            opacity: 0.9;
            transition: opacity 0.5s ease;
        }

        /* Controls */
        .controls-wrapper {
            position: absolute; 
            top: 30px;          
            right: 30px;        
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 20;
            transition: opacity 0.5s ease;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .upload-btn {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 69, 0, 0.4);
            color: #ff4500; 
            padding: 10px 20px; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 10px;
            transition: all 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            min-width: 120px;
        }
        .upload-btn:hover {
            background: #ff4500;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }

        .hint-text {
            color: rgba(255, 69, 0, 0.5);
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: right;
            margin-top: 5px;
        }

        input[type="file"] { display: none; }

        /* Webcam feedback */
        #webcam-wrapper {
            position: absolute; 
            bottom: 30px;       
            left: 30px;         
            width: 280px;       
            height: 210px;
            border: 1px solid rgba(255, 69, 0, 0.5); 
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            border-radius: 4px;
            overflow: hidden; 
            opacity: 1;         
            pointer-events: none;
            z-index: 50;
            background: #000;
            transition: opacity 0.5s ease; 
        }
        
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }

        /* Debug info for gestures */
        #debug-info {
            position: absolute;
            bottom: 5px;
            left: 5px;
            color: rgba(255, 69, 0, 0.8);
            font-size: 10px;
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
            pointer-events: none;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            /* 标题缩小 */
            h1 {
                font-size: 28px;
                letter-spacing: 3px;
                margin: 0;
            }

            /* UI层顶部内边距减小 */
            #ui-layer {
                padding-top: 15px;
            }

            /* 控制按钮组优化 */
            .controls-wrapper {
                top: 50px;
                right: 10px;
                gap: 6px;
            }

            .btn-group {
                flex-direction: column;
                gap: 6px;
            }

            .upload-btn {
                padding: 6px 12px;
                font-size: 8px;
                letter-spacing: 1px;
                min-width: 90px;
            }

            .hint-text {
                font-size: 7px;
                letter-spacing: 0.5px;
            }

            /* 摄像头区域大幅缩小 */
            #webcam-wrapper {
                bottom: 10px;
                left: 10px;
                width: 120px;
                height: 90px;
                border-width: 0.5px;
            }

            #debug-info {
                font-size: 7px;
                padding: 1px 3px;
                bottom: 2px;
                left: 2px;
            }
        }

        /* 超小屏幕进一步优化 */
        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
                letter-spacing: 2px;
            }

            #ui-layer {
                padding-top: 10px;
            }

            .controls-wrapper {
                top: 40px;
                right: 8px;
            }

            .upload-btn {
                padding: 5px 10px;
                font-size: 7px;
                min-width: 80px;
            }

            .hint-text {
                font-size: 6px;
            }

            #webcam-wrapper {
                width: 100px;
                height: 75px;
                bottom: 8px;
                left: 8px;
            }

            #debug-info {
                font-size: 6px;
            }
        }

        /* 照片管理模态框样式 */
        #photo-manager-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 13, 26, 0.95);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        #photo-manager-modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid rgba(255, 69, 0, 0.6);
            border-radius: 8px;
            padding: 30px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 69, 0, 0.3);
        }

        .modal-title {
            color: #ff4500;
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 100;
        }

        .modal-close {
            background: rgba(255, 69, 0, 0.2);
            border: 1px solid rgba(255, 69, 0, 0.4);
            color: #ff4500;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #ff4500;
            color: #000;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border: 1px solid rgba(255, 69, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .photo-item:hover {
            border-color: #ff4500;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.4);
            transform: scale(1.05);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-item .delete-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(153, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .photo-item:hover .delete-overlay {
            opacity: 1;
        }

        .delete-icon {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
        }

        .photo-count {
            color: rgba(255, 69, 0, 0.7);
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 10px;
            text-align: center;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                max-width: 95%;
            }

            .modal-title {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }

            .modal-close {
                padding: 6px 12px;
                font-size: 8px;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                padding: 15px;
            }

            .modal-title {
                font-size: 14px;
            }

            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 8px;
            }
        }
    </style>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading Memories</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <h1>Happy Spring Festival</h1>
        
        <div class="controls-wrapper">
            <div class="btn-group">
                <label class="upload-btn">
                    Select Folder
                    <input type="file" id="folder-input" webkitdirectory directory multiple>
                </label>
                
                <label class="upload-btn">

                <button class="upload-btn" id="manage-photos-btn">

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'; 
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- 核心配置 ---
        const CONFIG = {
            colors: {
                bg: 0x050d1a,
                fog: 0x050d1a,
                champagneGold: 0xffd966,
                deepGreen: 0x8b0000,
                accentRed: 0xff4500,
                chineseRed: 0xff2d2d,
                lanternRed: 0xcc0000,
                fuGold: 0xffd700
            },
            particles: {
                count: 1500,
                dustCount: 2000,
                snowCount: 1000,
                treeHeight: 24,
                treeRadius: 8
            },
            camera: { z: 50 },
            firework: {
                launchIntervalMin: 300,
                launchIntervalMax: 800,
                maxExplosions: 6,
                launchXRange: 15,
                targetHeightMin: 8,
                targetHeightMax: 18,
                colors: [0xff2d2d, 0xffd700, 0xffffff, 0x00ff7f, 0xda70d6, 0xff8c00],
                types: ['PEONY', 'WILLOW', 'CHRYSANTHEMUM', 'HEART', 'DOUBLE', 'RING']
            },
            preload: {
                autoScanLocal: true,
                scanCount: 200,
                images: [
                    'https://images.unsplash.com/photo-1543589077-47d81606c1bf?q=80&w=600',
                    'https://images.unsplash.com/photo-1576919228236-a097c32a5cd4?q=80&w=600',
                    'https://images.unsplash.com/photo-1512389142860-9c449e58a543?q=80&w=600',
                    'https://images.unsplash.com/photo-1482638588057-dce9509db949?q=80&w=600',
                ]
            }
        };

        const STATE = {
            mode: 'SCATTER',
            focusIndex: -1,
            focusTarget: null,
            hand: { detected: false, x: 0, y: 0 },
            rotation: { x: 0, y: 0 }
        };

        let scene, camera, renderer, composer;
        let mainGroup;
        let clock = new THREE.Clock();
        let particleSystem = [];
        let photoMeshGroup = new THREE.Group();
        let handLandmarker, video;
        let caneTexture;
        let snowSystem;
        let fireworkSystem;
        const decorations = [];
        const debugInfo = document.getElementById('debug-info');

        // --- 新增：照片管理数据结构 ---
        let photoDataArray = []; // 存储所有照片的元数据 { id, url, texture, particle, isVisible }
        let photoIdCounter = 0;

        async function init() {
            console.log('🎄 [init] 初始化开始...');
            console.log('🎄 [init] 当前页面 URL:', window.location.href);
            console.log('🎄 [init] 基础路径:', window.location.pathname);

            initThree();
            setupEnvironment();
            setupLights();
            createTextures();
            createParticles();
            createDust();
            createLanterns();
            createFuCharacters();
            createSnow();
            fireworkSystem = new FireworkSystem(scene);

            console.log('🎄 [init] 即将调用 loadPredefinedImages()');
            loadPredefinedImages();

            setupPostProcessing();
            setupEvents();
            await initMediaPipe();

            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 800);

            animate();
            console.log('🎄 [init] 初始化完成，动画已启动');
        }
// wp/electronicminer wish you a Merry Christmas!
        // --- 增强版图片加载系统 (支持 images.json) ---
        async function loadPredefinedImages() {
            console.log('🎄 [loadPredefinedImages] 开始加载预定义图片...');
            console.log('🎄 [loadPredefinedImages] autoScanLocal:', CONFIG.preload.autoScanLocal);
            console.log('🎄 [loadPredefinedImages] scanCount:', CONFIG.preload.scanCount);
            
            const loader = new THREE.TextureLoader();
            let loadedCount = 0;
            let failedCount = 0;
            
            // 扫描本地 images 目录
            if (CONFIG.preload.autoScanLocal) {
                // 方案1：尝试从 images.json 加载（新方式）
                console.log('📋 尝试加载 images.json 文件列表...');
                
                try {
                    const response = await fetch('./images.json');
                    if (response.ok) {
                        const data = await response.json();
                        console.log(`✅ images.json 加载成功！`);
                        console.log(`📊 文件信息: 总计 ${data.totalCount} 张图片`);
                        console.log(`🕒 生成时间: ${data.generatedAt}`);
                        console.log(` 基础目录: ${data.baseDir}`);
                        
                        // 使用 JSON 中的文件列表加载图片
                        data.images.forEach(filename => {
                            const path = `./${data.baseDir}/${filename}`;
                            console.log(`🖼️  加载: ${path}`);
                            
                            loader.load(path,
                                (t) => {
                                    t.colorSpace = THREE.SRGBColorSpace;
                                    addPhotoToScene(t, path);
                                    loadedCount++;
                                    console.log(`✅ 图片加载成功 (${loadedCount}/${data.totalCount}): ${filename}`);
                                },
                                undefined,
                                (error) => {
                                    failedCount++;
                                    console.warn(`❌ 图片加载失败: ${filename}`, error);
                                }
                            );
                        });
                        
                        // 延迟显示统计信息
                        setTimeout(() => {
                            console.log(`\n📊 图片加载统计 (JSON模式):`);
                            console.log(`   ✅ 成功加载: ${loadedCount} 张`);
                            console.log(`   ❌ 加载失败: ${failedCount} 张`);
                            console.log(`   📷 场景中的照片总数: ${photoDataArray.length}\n`);
                        }, 5000);
                        
                        return; // 使用 JSON 加载成功，直接返回
                    }
                } catch (error) {
                    console.log(`⚠️  images.json 不存在或加载失败，回退到数字扫描模式`);
                    console.log(`💡 提示: 运行 'npm run build:images' 生成 images.json 以支持任意文件名`);
                }
                
                // 方案2：回退到数字序号扫描（旧方式 - 向后兼容）
                console.log(`📂 开始扫描本地 ./images/ 目录 (1-${CONFIG.preload.scanCount})`);
                console.log(`📝 支持的文件名格式: [N].jpg, [N].png, ([N]).jpg, ([N]).png`);
                
                for (let i = 1; i <= CONFIG.preload.scanCount; i++) {
                    // 支持 4 种命名格式
                    const paths = [
                        `./images/${i}.jpg`,      // 无括号 JPG
                        `./images/${i}.png`,      // 无括号 PNG
                        `./images/(${i}).jpg`,    // 带括号 JPG
                        `./images/(${i}).png`     // 带括号 PNG
                    ];
                    
                    let loaded = false;
                    let attemptCount = 0;
                    
                    // 尝试所有路径
                    const tryLoadPath = (index) => {
                        if (index >= paths.length || loaded) return;
                        
                        const path = paths[index];
                        attemptCount++;
                        
                        loader.load(path,
                            (t) => {
                                if (!loaded) {
                                    t.colorSpace = THREE.SRGBColorSpace;
                                    addPhotoToScene(t, path);
                                    loadedCount++;
                                    loaded = true;
                                    console.log(`✅ 图片加载成功 (${loadedCount}): ${path}`);
                                }
                            },
                            undefined,
                            (error) => {
                                // 当前路径失败，尝试下一个
                                tryLoadPath(index + 1);
                                
                                // 所有路径都失败了
                                if (index === paths.length - 1 && !loaded) {
                                    failedCount++;
                                    console.log(`⚠️  图片 ${i} 未找到 (尝试了所有格式)`);
                                }
                            }
                        );
                    };
                    
                    tryLoadPath(0);
                }
                
                // 延迟显示统计信息
                setTimeout(() => {
                    console.log(`\n📊 图片加载统计 (数字扫描模式):`);
                    console.log(`   ✅ 成功加载: ${loadedCount} 张`);
                    console.log(`   ❌ 未找到: ${failedCount} 个编号`);
                    console.log(`   📷 场景中的照片总数: ${photoDataArray.length}\n`);
                    
                    if (loadedCount === 0 && CONFIG.preload.autoScanLocal) {
                        console.warn(`\n⚠️  警告：未能从 ./images/ 目录加载任何照片！`);
                        console.warn(`请确保：`);
                        console.warn(`  1. ./images/ 目录存在`);
                        console.warn(`  2. 图片文件命名为: 1.jpg, 2.jpg... 或 (1).jpg, (2).jpg...`);
                        console.warn(`  3. 或运行 'npm run build:images' 生成 images.json 以支持任意文件名`);
                        console.warn(`  4. http-server 正在运行并能访问 images 目录`);
                        console.warn(`  5. 检查浏览器控制台是否有 CORS 错误\n`);
                    }
                }, 5000);
            }
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            // 设置 Three.js 场景背景为深蓝色，与 CSS 渐变配合
            scene.background = new THREE.Color(CONFIG.colors.bg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.fog, 0.015); // 调整雾气浓度

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, CONFIG.camera.z);

            // 启用 alpha: true 以便未来如果有需要可以透过背景
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;
            
            // 🔧 修复：降低色调映射曝光度，避免过度曝光影响照片
            // 原值 2.2 会让整个场景过亮，影响照片原始色彩
            // 新值 1.5 保持场景亮度的同时，减少对照片的影响
            renderer.toneMappingExposure = 1.5;  // 从 2.2 降至 1.5
            
            container.appendChild(renderer.domElement);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);

// wp/electronicminer wish you a Merry Christmas!

        function createSnow() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const velocities = [];

            // 创建一个简单的圆形纹理作为雪花

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                const x = THREE.MathUtils.randFloatSpread(100);
                const y = THREE.MathUtils.randFloatSpread(60);
                const z = THREE.MathUtils.randFloatSpread(60);
                vertices.push(x, y, z);
                
                // 存储每个雪花的速度和摆动参数
                velocities.push(
                    Math.random() * 0.2 + 0.1, // fall speed
                    Math.random() * 0.05       // sway speed
                );
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('userData', new THREE.Float32BufferAttribute(velocities, 2));

                color: 0xffffff,
                size: 0.4,
                map: snowTexture,
                transparent: true,
                opacity: 0.8,

        function updateSnow() {
            if (!snowSystem) return;
            
            const positions = snowSystem.geometry.attributes.position.array;
            const userData = snowSystem.geometry.attributes.userData.array;

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                // Y轴下落
                const fallSpeed = userData[i * 2];
                positions[i * 3 + 1] -= fallSpeed;

                // X轴摇摆
                const swaySpeed = userData[i * 2 + 1];
                positions[i * 3] += Math.sin(clock.elapsedTime * 2 + i) * swaySpeed * 0.1;

                // 循环重置
                if (positions[i * 3 + 1] < -30) {
                    positions[i * 3 + 1] = 30;
                    positions[i * 3] = THREE.MathUtils.randFloatSpread(100);
                    positions[i * 3 + 2] = THREE.MathUtils.randFloatSpread(60);
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
        }

        class Explosion {
            constructor(position, color, type, sceneRef) {
                this.position = position.clone();
                this.color = color;
                this.type = type;
                this.sceneRef = sceneRef;
                this.life = 2.0;
                this.alive = true;
                this.particles = [];
                this.createParticles();
            }

            createParticles() {
                const counts = { PEONY: 150, WILLOW: 100, CHRYSANTHEMUM: 180, HEART: 120, DOUBLE: 200, RING: 100 };
                const count = counts[this.type] || 150;
                const positions = new Float32Array(count * 3);
                const velocities = [];

                for (let i = 0; i < count; i++) {
                    positions[i * 3] = this.position.x;
                    positions[i * 3 + 1] = this.position.y;
                    positions[i * 3 + 2] = this.position.z;
                    const vel = this.getVelocity(i, count);
                    velocities.push(vel);
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: this.color,
                    size: 0.25,
                    transparent: true,
                    opacity: 1,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.points = new THREE.Points(geometry, material);
                this.sceneRef.add(this.points);
                this.velocities = velocities;
            }

            getVelocity(i, count) {
                const speed = 4 + Math.random() * 4;
                let dir;
                if (this.type === 'HEART') {
                    const t = (i / count) * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    dir = new THREE.Vector3(x * 0.06, y * 0.06, THREE.MathUtils.randFloatSpread(0.5)).normalize();
                } else if (this.type === 'RING') {
                    const angle = (i / count) * Math.PI * 2;
                    dir = new THREE.Vector3(Math.cos(angle), 0.1, Math.sin(angle)).normalize();
                } else if (this.type === 'WILLOW') {
                    dir = new THREE.Vector3().randomDirection();
                    dir.y = Math.abs(dir.y) * 0.3;
                } else {
                    dir = new THREE.Vector3().randomDirection();
                }
                return dir.multiplyScalar(speed);
            }

            update(dt) {
                if (!this.alive) return;
                this.life -= dt;
                if (this.life <= 0) { this.alive = false; return; }

                const positions = this.points.geometry.attributes.position.array;
                const gravity = this.type === 'WILLOW' ? 8 : 5;

                for (let i = 0; i < this.velocities.length; i++) {
                    this.velocities[i].y -= gravity * dt;
                    this.velocities[i].multiplyScalar(0.98);
                    positions[i * 3] += this.velocities[i].x * dt;
                    positions[i * 3 + 1] += this.velocities[i].y * dt;
                    positions[i * 3 + 2] += this.velocities[i].z * dt;
                }

                this.points.geometry.attributes.position.needsUpdate = true;
                this.points.material.opacity = Math.max(this.life / 2.0, 0);
            }

            dispose(sceneRef) {
                sceneRef.remove(this.points);
                this.points.geometry.dispose();
                this.points.material.dispose();
            }
        }

        class Rocket {
            constructor(startPos, targetHeight, color, type, sceneRef) {
                this.position = startPos.clone();
                this.targetHeight = targetHeight;
                this.color = color;
                this.type = type;
                this.sceneRef = sceneRef;
                this.alive = true;
                this.velocity = new THREE.Vector3(0, 15, 0);

                const geo = new THREE.SphereGeometry(0.15, 8, 8);
                const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1 });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.copy(this.position);
                sceneRef.add(this.mesh);

                this.trailPositions = [];
                this.trailGeometry = new THREE.BufferGeometry();
                this.trailMaterial = new THREE.PointsMaterial({
                    color: color, size: 0.1, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
                });
                this.trail = new THREE.Points(this.trailGeometry, this.trailMaterial);
                sceneRef.add(this.trail);
            }

            update(dt) {
                this.position.add(this.velocity.clone().multiplyScalar(dt));
                this.mesh.position.copy(this.position);
                this.trailPositions.push(this.position.x, this.position.y, this.position.z);
                if (this.trailPositions.length > 60) this.trailPositions.splice(0, 3);
                this.trailGeometry.setAttribute('position', new THREE.Float32BufferAttribute(this.trailPositions, 3));
            }

            dispose(sceneRef) {
                sceneRef.remove(this.mesh);
                sceneRef.remove(this.trail);
                this.mesh.geometry.dispose();
                this.mesh.material.dispose();
                this.trailGeometry.dispose();
                this.trailMaterial.dispose();
            }
        }

        class FireworkSystem {
            constructor(sceneRef) {
                this.sceneRef = sceneRef;
                this.rockets = [];
                this.explosions = [];
                this.lastLaunchTime = 0;
            }

            update(dt, currentTime, isActive) {
                if (isActive && this.explosions.length < CONFIG.firework.maxExplosions) {
                    const interval = THREE.MathUtils.randInt(CONFIG.firework.launchIntervalMin, CONFIG.firework.launchIntervalMax);
                    if (currentTime - this.lastLaunchTime > interval) {
                        this.launchRocket();
                        this.lastLaunchTime = currentTime;
                    }
                }

                this.rockets = this.rockets.filter(rocket => {
                    rocket.update(dt);
                    if (rocket.position.y >= rocket.targetHeight) {
                        this.createExplosion(rocket);
                        rocket.dispose(this.sceneRef);
                        return false;
                    }
                    return rocket.alive;
                });

                this.explosions = this.explosions.filter(explosion => {
                    explosion.update(dt);
                    if (!explosion.alive) {
                        explosion.dispose(this.sceneRef);
                        return false;
                    }
                    return true;
                });
            }

            launchRocket() {
                const x = THREE.MathUtils.randFloatSpread(CONFIG.firework.launchXRange * 2);
                const startPos = new THREE.Vector3(x, -15, THREE.MathUtils.randFloatSpread(10));
                const targetHeight = THREE.MathUtils.randFloat(CONFIG.firework.targetHeightMin, CONFIG.firework.targetHeightMax);
                const color = CONFIG.firework.colors[Math.floor(Math.random() * CONFIG.firework.colors.length)];
                const type = CONFIG.firework.types[Math.floor(Math.random() * CONFIG.firework.types.length)];
                this.rockets.push(new Rocket(startPos, targetHeight, color, type, this.sceneRef));
            }

            createExplosion(rocket) {
                this.explosions.push(new Explosion(rocket.position, rocket.color, rocket.type, this.sceneRef));
            }

            dispose() {
                this.rockets.forEach(r => r.dispose(this.sceneRef));
                this.explosions.forEach(e => e.dispose(this.sceneRef));
                this.rockets = [];
                this.explosions = [];
            }
        }

        class Particle {
            constructor(mesh, type, isDust = false) {
                this.mesh = mesh;
                this.type = type;
                this.isDust = isDust;
                
                this.posTree = new THREE.Vector3();
                this.posScatter = new THREE.Vector3();
                this.baseScale = mesh.scale.x; 

                const speedMult = (type === 'PHOTO') ? 0.3 : 2.0;

                this.spinSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult
                );

                this.calculatePositions();
            }

            calculatePositions() {
                if (this.type === 'PHOTO') {
                    this.posTree.set(0, 0, 0); 
                    const rScatter = 8 + Math.random()*12;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(
                        rScatter * Math.sin(phi) * Math.cos(theta),
                        rScatter * Math.sin(phi) * Math.sin(theta),
                        rScatter * Math.cos(phi)
                    );
                    return;
                }

                const h = CONFIG.particles.treeHeight;
                const halfH = h / 2;
                let t = Math.random(); 
                t = Math.pow(t, 0.8); 
                const y = (t * h) - halfH;
                
                let rMax = CONFIG.particles.treeRadius * (1.0 - t); 
                if (rMax < 0.5) rMax = 0.5;

                const angle = t * 50 * Math.PI + Math.random() * Math.PI; 
                const r = rMax * (0.8 + Math.random() * 0.4); 
                this.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);

                let rScatter = this.isDust ? (12 + Math.random()*20) : (8 + Math.random()*12);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(
                    rScatter * Math.sin(phi) * Math.cos(theta),
                    rScatter * Math.sin(phi) * Math.sin(theta),
                    rScatter * Math.cos(phi)
                );
            }
// wp/electronicminer wish you a Merry Christmas!
            update(dt, mode, focusTargetMesh) {
                let target = this.posScatter;

                if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 35);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    }
                }

                const lerpSpeed = (mode === 'FOCUS' && this.mesh === focusTargetMesh) ? 5.0 : 2.0;
                this.mesh.position.lerp(target, lerpSpeed * dt);

                if (mode === 'SCATTER' || mode === 'FIREWORK') {
                    this.mesh.rotation.x += this.spinSpeed.x * dt;
                    this.mesh.rotation.y += this.spinSpeed.y * dt;
                    this.mesh.rotation.z += this.spinSpeed.z * dt;
                }

                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) {
                    this.mesh.lookAt(camera.position);
                }

                let s = this.baseScale;
                if (this.isDust) {
                    s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                } else if ((mode === 'SCATTER' || mode === 'FIREWORK') && this.type === 'PHOTO') {
                    s = this.baseScale * 2.5;
                } else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) s = 4.5;
                    else s = this.baseScale * 0.8;
                }

                this.mesh.scale.lerp(new THREE.Vector3(s,s,s), 4*dt);
            }
        }

        function updatePhotoLayout() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO');
            const count = photos.length;
            if (count === 0) return;

            const h = CONFIG.particles.treeHeight * 0.9;
            const bottomY = -h/2;
            const stepY = h / count;
            const loops = 3;

            photos.forEach((p, i) => {
                const y = bottomY + stepY * i + stepY/2;
                const fullH = CONFIG.particles.treeHeight;
                const normalizedH = (y + fullH/2) / fullH; 

                let rMax = CONFIG.particles.treeRadius * (1.0 - normalizedH);
                if (rMax < 1.0) rMax = 1.0;
                
                const r = rMax + 3.0; 
                const angle = normalizedH * Math.PI * 2 * loops + (Math.PI/4); 

                p.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
            });
        }

                    mesh = new THREE.Mesh(sphereGeo, redMat);

                    mesh = new THREE.Mesh(candyGeo, candyMat);

                mesh.scale.set(s,s,s);

            decorations.forEach(dec => {
                if (dec.userData.baseY !== undefined) {
                    dec.position.y = dec.userData.baseY + Math.sin(time * 0.5 + dec.userData.floatOffset) * 0.3;
                }
                if (dec.userData.baseRotation !== undefined) {
                    dec.rotation.z = dec.userData.baseRotation + Math.sin(time * 0.3 + dec.userData.rotateOffset) * 0.1;
                }
            });
        }

        function addPhotoToScene(texture, sourceUrl = null) {
            let width = 1.2;
            let height = 1.2;
            
            if (texture.image) {
                const aspect = texture.image.width / texture.image.height;
                if (aspect > 1) {
                    height = width / aspect;
                } else {
                    width = height * aspect;
                }
            }

            // 🔍 调试日志：检查纹理属性
            console.log('📸 [addPhotoToScene] 创建照片:', {
                url: sourceUrl,
                textureColorSpace: texture.colorSpace,
                hasImage: !!texture.image,
                imageSize: texture.image ? `${texture.image.width}x${texture.image.height}` : 'N/A'
            });

            // 创建金色边框（受光照影响）
            const borderWidth = width * 1.15;  // 边框比照片大 15%
            const borderHeight = height * 1.15;
            const borderGeo = new THREE.PlaneGeometry(borderWidth, borderHeight);
            const borderMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700,  // 金色
                metalness: 0.8,
                roughness: 0.2,
                side: THREE.DoubleSide,
                emissive: 0x443300,
                
                // 🔧 修复：降低边框自发光强度，避免触发 Bloom
                emissiveIntensity: 0.05  // 从 0.1 降至 0.05
            });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.z = -0.01;  // 边框在照片后面
            border.renderOrder = 998;  // 边框在照片之前渲染

            // 创建照片（不受光照影响）
            const photoGeo = new THREE.PlaneGeometry(width, height);
            const photoMat = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                toneMapped: false,  // 关键：禁用色调映射，保持原始颜色
                
                // 🔧 修复：优化渲染顺序和深度测试
                // renderOrder 越大越晚渲染，确保照片在后处理前最后渲染
                // depthWrite: false 避免照片影响其他物体的深度测试
            });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = 0.01;  // 照片在前面
            photo.renderOrder = 999;  // 最高渲染优先级，最后渲染
            
            // 🔧 修复：设置照片图层，便于后续选择性渲染
            photo.layers.enable(0);  // 默认图层
            photo.layers.enable(1);  // 照片专用图层

            // 🔍 调试日志：检查照片材质属性
            console.log('🎨 [addPhotoToScene] 照片材质配置 (已优化):', {
                type: photoMat.type,
                toneMapped: photoMat.toneMapped,
                side: photoMat.side,
                renderOrder: photo.renderOrder,
                layers: photo.layers.mask,
                note: 'renderOrder=999 确保最后渲染，减少后处理影响'
            });

            // 组合边框和照片
            const group = new THREE.Group();
            group.add(border);
            group.add(photo);

            const s = 0.8;
            group.scale.set(s,s,s);
            
            photoMeshGroup.add(group);
            const particle = new Particle(group, 'PHOTO', false);
            particleSystem.push(particle);

            // 保存照片元数据
            const photoData = {
                id: photoIdCounter++,
                url: sourceUrl || texture.image?.src || 'data:image',
                texture: texture,
                particle: particle,
                isVisible: true
            };
            photoDataArray.push(photoData);

            updatePhotoLayout();
            return photoData;
        }
        // wp/electronicminer wish you a Merry Christmas!
        function handleImageUpload(e) {
            const files = e.target.files;
            if(!files.length) return;
            
            Array.from(files).forEach(f => {
                if (!f.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t, ev.target.result);
                    });
                }
                reader.readAsDataURL(f);
            });
        }

        // --- 新增：照片管理功能 ---
        function removePhotoFromScene(photoData) {
            if (!photoData || !photoData.isVisible) return;

            // 从场景中移除mesh
            const particle = photoData.particle;
            if (particle && particle.mesh) {
                photoMeshGroup.remove(particle.mesh);
                
                // 从粒子系统中移除
                const index = particleSystem.indexOf(particle);
                if (index > -1) {
                    particleSystem.splice(index, 1);
                }
                
                // 清理几何体和材质
                if (particle.mesh.children) {
                    particle.mesh.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (child.material.map) child.material.map.dispose();
                            child.material.dispose();
                        }
                    });
                }
            }

            // 标记为不可见
            photoData.isVisible = false;

            // 重新布局剩余照片
            updatePhotoLayout();
        }

        function openPhotoManager() {
            const modal = document.getElementById('photo-manager-modal');
            const grid = document.getElementById('photo-grid');
            const count = document.getElementById('photo-count');
            
            // 清空网格
            grid.innerHTML = '';
            
            // 获取所有可见照片
            const visiblePhotos = photoDataArray.filter(p => p.isVisible);
            count.textContent = `Total Photos: ${visiblePhotos.length}`;
            
            if (visiblePhotos.length === 0) {
                grid.innerHTML = '<div style="color: rgba(255, 69, 0, 0.5); text-align: center; padding: 40px; grid-column: 1/-1;">No photos available</div>';
            } else {
                visiblePhotos.forEach(photoData => {
                    const item = document.createElement('div');
                    item.className = 'photo-item';
                    
                    // 创建缩略图
                    const img = document.createElement('img');
                    
                    // 处理不同类型的图片源
                    if (photoData.texture && photoData.texture.image) {
                        if (photoData.texture.image instanceof HTMLImageElement) {
                            img.src = photoData.texture.image.src;
                        } else if (photoData.texture.image instanceof HTMLCanvasElement) {
                            img.src = photoData.texture.image.toDataURL();
                        } else {
                            img.src = photoData.url;
                        }
                    } else {
                        img.src = photoData.url;
                    }
                    
                    img.alt = 'Photo';
                    img.onerror = () => {
                        img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23333" width="100" height="100"/><text x="50" y="50" text-anchor="middle" fill="%23ff4500" font-size="12">Image</text></svg>';
                    };
                    
                    // 创建删除覆盖层
                    const overlay = document.createElement('div');
                    overlay.className = 'delete-overlay';
                    overlay.innerHTML = '<div class="delete-icon">✕</div>';
                    
                    item.appendChild(img);
                    item.appendChild(overlay);
                    
                    // 点击删除
                    item.addEventListener('click', () => {
                        if (confirm('Delete this photo from the scene?\n(This will NOT delete the file from your ./images/ folder)')) {
                            removePhotoFromScene(photoData);
                            item.remove();
                            
                            // 更新计数
                            const newVisiblePhotos = photoDataArray.filter(p => p.isVisible);
                            count.textContent = `Total Photos: ${newVisiblePhotos.length}`;
                            
                            if (newVisiblePhotos.length === 0) {
                                grid.innerHTML = '<div style="color: rgba(255, 69, 0, 0.5); text-align: center; padding: 40px; grid-column: 1/-1;">No photos available</div>';
                            }
                        }
                    });
                    
                    grid.appendChild(item);
                });
            }
            
            modal.classList.add('active');
        }

        function closePhotoManager() {
            const modal = document.getElementById('photo-manager-modal');
            modal.classList.remove('active');
        }

        // --- MEDIAPIPE (Adaptive Fix) ---
        async function initMediaPipe() {
            video = document.getElementById('webcam');
            
            // Adjust to get best available resolution if possible
            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    frameRate: { ideal: 30 }
                }
            };

            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
            
            if (navigator.mediaDevices?.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                    debugInfo.innerText = "Webcam active. Show hand.";
                } catch(e) {
                    console.warn("Webcam access denied or not available", e);
                    debugInfo.innerText = "Camera error: " + e.message;
                    document.getElementById('webcam-wrapper').style.display = 'none';
                }
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    processGestures(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        // 修复核心：使用相对比例而非绝对距离
        function processGestures(result) {
            if (result.landmarks && result.landmarks.length > 0) {
                STATE.hand.detected = true;
                const lm = result.landmarks[0];
                STATE.hand.x = (lm[9].x - 0.5) * 2; 
                STATE.hand.y = (lm[9].y - 0.5) * 2;

                const thumb = lm[4]; 
                const index = lm[8]; 
                const wrist = lm[0];
                const middleMCP = lm[9]; // 中指指根 (Knuckle)

                // 1. 计算手掌基准大小 (手腕到中指指根的距离)
                const handSize = Math.hypot(middleMCP.x - wrist.x, middleMCP.y - wrist.y);
                if (handSize < 0.02) return;

                // 2. 计算手指尖端的平均伸展距离
                const tips = [lm[8], lm[12], lm[16], lm[20]];
                let avgTipDist = 0;
                tips.forEach(t => avgTipDist += Math.hypot(t.x - wrist.x, t.y - wrist.y));
                avgTipDist /= 4;

                // 3. 计算捏合距离 (拇指到食指)
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);

                // 4. 计算相对比例
                const extensionRatio = avgTipDist / handSize;
                const pinchRatio = pinchDist / handSize;

                // 调试显示
                debugInfo.innerText = `Size: ${handSize.toFixed(2)} | Ext: ${extensionRatio.toFixed(2)} | Pinch: ${pinchRatio.toFixed(2)} | Mode: ${STATE.mode}`;

                // 5. 状态判定 - 春节版
                if (extensionRatio < 1.5) {
                    // 握拳 → SCATTER
                    STATE.mode = 'SCATTER';
                    STATE.focusTarget = null;
                } else if (pinchRatio < 0.35) {
                    // 捏合 → FOCUS
                    if (STATE.mode !== 'FOCUS') {
                        STATE.mode = 'FOCUS';
                        const photos = particleSystem.filter(p => p.type === 'PHOTO');
                        if (photos.length) STATE.focusTarget = photos[Math.floor(Math.random()*photos.length)].mesh;
                    }
                } else if (extensionRatio > 1.7) {
                    // 张开手掌 → FIREWORK
                    STATE.mode = 'FIREWORK';
                    STATE.focusTarget = null;
                }
            } else {
                STATE.hand.detected = false;
                debugInfo.innerText = "No hand detected";
            }
        }
// wp/electronicminer wish you a Merry Christmas!
        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            
            document.getElementById('file-input').addEventListener('change', handleImageUpload);
            document.getElementById('folder-input').addEventListener('change', handleImageUpload);
            
            // 照片管理按钮
            document.getElementById('manage-photos-btn').addEventListener('click', openPhotoManager);
            document.getElementById('close-modal-btn').addEventListener('click', closePhotoManager);
            
            // 点击模态框背景关闭
            document.getElementById('photo-manager-modal').addEventListener('click', (e) => {
                if (e.target.id === 'photo-manager-modal') {
                    closePhotoManager();
                }
            });
            
            // ESC键关闭模态框
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closePhotoManager();
                }
                
                if (e.key.toLowerCase() === 'h') {
                    const controls = document.querySelector('.controls-wrapper');
                    if (controls) controls.classList.toggle('ui-hidden');
                    const webcam = document.getElementById('webcam-wrapper');
                    if(webcam) webcam.classList.toggle('ui-hidden');
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const currentTime = performance.now();

            // Rotation Logic
            if ((STATE.mode === 'SCATTER' || STATE.mode === 'FIREWORK') && STATE.hand.detected) {
                const targetRotY = STATE.hand.x * Math.PI * 0.9;
                const targetRotX = STATE.hand.y * Math.PI * 0.25;
                STATE.rotation.y += (targetRotY - STATE.rotation.y) * 3.0 * dt;
                STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.0 * dt;
            } else {
                STATE.rotation.y += 0.1 * dt;
                STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt;
            }

            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;

            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget));

            updateSnow();
            updateDecorations(dt);
            fireworkSystem.update(dt, currentTime, STATE.mode === 'FIREWORK');

            composer.render();
        }
// wp/electronicminer wish you a Merry Christmas!
        init();
    </script>
