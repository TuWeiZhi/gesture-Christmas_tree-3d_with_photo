    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'; 
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- 核心配置 ---
        const CONFIG = {
            colors: {
                bg: 0x050d1a,
                fog: 0x050d1a,
                champagneGold: 0xffd966,
                deepGreen: 0x8b0000,
                accentRed: 0xff4500,
                chineseRed: 0xff2d2d
            },
            particles: {
                count: 1500,
                dustCount: 2000,
                snowCount: 1000,
                treeHeight: 24,
                treeRadius: 8
            },
            camera: { z: 50 },
            firework: {
                launchIntervalMin: 150,
                launchIntervalMax: 500,
                maxExplosions: 8,
                launchXRange: 25,
                targetHeightMin: 6,
                targetHeightMax: 20,
                colors: [
                    0xFF1744, 0x00E676, 0x00B0FF, 0xFFD600, 0xFFFFFF,
                    0xAA00FF, 0xFF6D00, 0x18FFFF, 0xFF4081, 0x69F0AE,
                    0x448AFF, 0xFFAB40, 0xE040FB, 0x76FF03
                ],
                types: ['PEONY', 'CHRYSANTHEMUM', 'WILLOW', 'PALM', 'CROSSETTE', 'STROBE', 'RING', 'PISTIL'],
                palettePerExplosionMin: 2,
                palettePerExplosionMax: 5
            },
            preload: {
                autoScanLocal: true,
                scanCount: 200,
                images: [
                    'https://images.unsplash.com/photo-1543589077-47d81606c1bf?q=80&w=600',
                    'https://images.unsplash.com/photo-1576919228236-a097c32a5cd4?q=80&w=600',
                    'https://images.unsplash.com/photo-1512389142860-9c449e58a543?q=80&w=600',
                    'https://images.unsplash.com/photo-1482638588057-dce9509db949?q=80&w=600',
                ]
            }
        };

        const STATE = {
            mode: 'SCATTER',
            focusIndex: -1,
            focusTarget: null,
            candidateTarget: null,
            hand: { detected: false, x: 0, y: 0, filteredX: 0, lastRotateX: null },
            rotation: { x: 0, y: 0, targetY: 0 }
        };

        const CANDIDATE_SWITCH_THRESHOLD = 0.03;
        const CANDIDATE_COOLDOWN = 150;
        const CANDIDATE_VIEW_MARGIN = 1.15;
        const CANDIDATE_VERTICAL_DEADBAND = 0.18;
        const CANDIDATE_VERTICAL_WEIGHT = 0.20;
        let lastCandidateSwitchTime = 0;
        let focusGestureFrameCount = 0;
        let focusGestureReleaseFrameCount = 0;
        let fireworkGestureFrameCount = 0;

        // 增量旋转配置
        const ROTATION_Y_SENSITIVITY = Math.PI * 0.90;
        const ROTATION_X_LIMIT = Math.PI * 0.22;
        const ROTATION_DELTA_DEADZONE = 0.003;
        const ROTATION_DELTA_MAX = 0.035;
        const ROTATION_INPUT_SMOOTHING = 0.35;
        const ROTATION_RENDER_SMOOTHING = 10.0;

        const FOCUS_ENTER_FRAMES = 2;
        const FOCUS_EXIT_FRAMES = 2;
        const FIREWORK_ENTER_FRAMES = 2;

        const SCATTER_EXTENSION_THRESHOLD = 1.45;
        const FIREWORK_EXTENSION_THRESHOLD = 1.65;
        const FIREWORK_MIN_FINGER_THRESHOLD = 1.25;

        let scene, camera, renderer, composer;
        let mainGroup;
        let clock = new THREE.Clock();
        let particleSystem = [];
        let photoMeshGroup = new THREE.Group();
        let handLandmarker, video;
        let caneTexture;
        let snowSystem;
        let fireworkSystem;
        const textureCache = new Map();
        let glowTextureCache = null;
        const debugInfo = document.getElementById('debug-info');

        // --- 新增：照片管理数据结构 ---
        let photoDataArray = []; // 存储所有照片的元数据 { id, url, texture, particle, isVisible }
        let photoIdCounter = 0;

        const _candidateWorldPos = new THREE.Vector3();
        const _candidateNdc = new THREE.Vector3();

        function worldToScreen(worldPos) {
            _candidateNdc.copy(worldPos).project(camera);
            return { x: _candidateNdc.x, y: _candidateNdc.y, z: _candidateNdc.z };
        }

        function isCandidateInView(screenPos) {
            return screenPos.z > -1
                && screenPos.z < 1
                && Math.abs(screenPos.x) <= CANDIDATE_VIEW_MARGIN
                && Math.abs(screenPos.y) <= CANDIDATE_VIEW_MARGIN;
        }

        function getCandidateScore(screenPos) {
            const horizontal = Math.abs(screenPos.x);
            const vertical = Math.max(0, Math.abs(screenPos.y) - CANDIDATE_VERTICAL_DEADBAND);
            return horizontal + vertical * CANDIDATE_VERTICAL_WEIGHT;
        }

        function getPhotoScreenMetrics(photoMesh) {
            photoMesh.getWorldPosition(_candidateWorldPos);
            const screenPos = worldToScreen(_candidateWorldPos);
            return {
                screenPos,
                inView: isCandidateInView(screenPos),
                score: getCandidateScore(screenPos)
            };
        }

        function updateCandidatePhoto() {
            let closest = null;
            let minScore = Infinity;

            particleSystem.forEach(p => {
                if (p.type !== 'PHOTO') return;
                if (p.visState !== 'VISIBLE') return;
                if (!p.mesh.visible) return;

                const metrics = getPhotoScreenMetrics(p.mesh);
                if (!metrics.inView) return;

                if (metrics.score < minScore) {
                    minScore = metrics.score;
                    closest = p.mesh;
                }
            });

            if (closest === null) {
                updateCandidateTarget(null);
                return;
            }

            updateCandidateTarget(closest);
        }

        function updateCandidateTarget(newTarget, bypassDebounce = false) {
            const now = performance.now();

            if (newTarget === null) {
                STATE.candidateTarget = null;
                return;
            }

            if (STATE.candidateTarget === newTarget) {
                return;
            }

            if (STATE.candidateTarget === null) {
                bypassDebounce = true;
            }

            if (!bypassDebounce && STATE.candidateTarget) {
                const oldMetrics = getPhotoScreenMetrics(STATE.candidateTarget);

                if (!oldMetrics.inView) {
                    bypassDebounce = true;
                } else {
                    if (now - lastCandidateSwitchTime < CANDIDATE_COOLDOWN) {
                        return;
                    }

                    const newMetrics = getPhotoScreenMetrics(newTarget);
                    const oldDist = oldMetrics.score;
                    const newDist = newMetrics.score;

                    if (newDist >= oldDist - CANDIDATE_SWITCH_THRESHOLD) {
                        return;
                    }
                }
            }

            STATE.candidateTarget = newTarget;
            lastCandidateSwitchTime = now;
        }

        function resetHandRotationTracking() {
            STATE.hand.filteredX = STATE.hand.x || 0;
            STATE.hand.lastRotateX = null;
        }

        function exitFocusMode() {
            STATE.mode = 'SCATTER';
            STATE.focusTarget = null;
            focusGestureReleaseFrameCount = 0;
            resetHandRotationTracking();
        }

        function updateRotationFromHand(currentHandX) {
            if (STATE.hand.lastRotateX === null) {
                STATE.hand.filteredX = currentHandX;
                STATE.hand.lastRotateX = currentHandX;
                return;
            }

            STATE.hand.filteredX = THREE.MathUtils.lerp(
                STATE.hand.filteredX,
                currentHandX,
                ROTATION_INPUT_SMOOTHING
            );

            let deltaX = STATE.hand.filteredX - STATE.hand.lastRotateX;
            STATE.hand.lastRotateX = STATE.hand.filteredX;

            const absDeltaX = Math.abs(deltaX);
            if (absDeltaX <= ROTATION_DELTA_DEADZONE) return;

            deltaX = Math.sign(deltaX) * THREE.MathUtils.clamp(
                absDeltaX - ROTATION_DELTA_DEADZONE,
                0,
                ROTATION_DELTA_MAX
            );

            STATE.rotation.targetY += deltaX * ROTATION_Y_SENSITIVITY;
        }

        function isVGesture(lm, handSize) {
            const wrist = lm[0];
            const distToWrist = point => Math.hypot(point.x - wrist.x, point.y - wrist.y);

            const indexDist = distToWrist(lm[8]);
            const middleDist = distToWrist(lm[12]);
            const ringDist = distToWrist(lm[16]);
            const pinkyDist = distToWrist(lm[20]);
            const fingerSpread = Math.hypot(lm[8].x - lm[12].x, lm[8].y - lm[12].y);

            return indexDist > handSize * 1.55
                && middleDist > handSize * 1.60
                && ringDist < handSize * 1.45
                && pinkyDist < handSize * 1.35
                && fingerSpread > handSize * 0.35;
        }

        async function init() {
            console.log('🎄 [init] 初始化开始...');
            console.log('🎄 [init] 当前页面 URL:', window.location.href);
            console.log('🎄 [init] 基础路径:', window.location.pathname);

            initThree();
            setupEnvironment();
            setupLights();
            createTextures();
            createParticles();
            createDust();
            createSnow();
            fireworkSystem = new FireworkSystem(scene);

            console.log('🎄 [init] 即将调用 loadPredefinedImages()');
            loadPredefinedImages();

            setupPostProcessing();
            setupEvents();
            await initMediaPipe();

            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 800);

            animate();
            console.log('🎄 [init] 初始化完成，动画已启动');
        }
// wp/electronicminer wish you a Merry Christmas!
        // --- 增强版图片加载系统 (支持 images.json) ---
        async function loadPredefinedImages() {
            console.log('🎄 [loadPredefinedImages] 开始加载预定义图片...');
            console.log('🎄 [loadPredefinedImages] autoScanLocal:', CONFIG.preload.autoScanLocal);
            console.log('🎄 [loadPredefinedImages] scanCount:', CONFIG.preload.scanCount);
            
            const loader = new THREE.TextureLoader();
            let loadedCount = 0;
            let failedCount = 0;
            
            // 扫描本地 images 目录
            if (CONFIG.preload.autoScanLocal) {
                // 方案1：尝试从 images.json 加载（新方式）
                console.log('📋 尝试加载 images.json 文件列表...');
                
                try {
                    const response = await fetch('./images.json');
                    if (response.ok) {
                        const data = await response.json();
                        console.log(`✅ images.json 加载成功！`);
                        console.log(`📊 文件信息: 总计 ${data.totalCount} 张图片`);
                        console.log(`🕒 生成时间: ${data.generatedAt}`);
                        console.log(` 基础目录: ${data.baseDir}`);
                        
                        // 使用 JSON 中的文件列表加载图片
                        data.images.forEach(filename => {
                            const path = `./${data.baseDir}/${filename}`;
                            console.log(`🖼️  加载: ${path}`);
                            
                            loader.load(path,

                        // 延迟显示统计信息

                }
                
                // 方案2：回退到数字序号扫描（旧方式 - 向后兼容）
                console.log(`📂 开始扫描本地 ./images/ 目录 (1-${CONFIG.preload.scanCount})`);
                console.log(`📝 支持的文件名格式: [N].jpg, [N].png, ([N]).jpg, ([N]).png`);
                
                for (let i = 1; i <= CONFIG.preload.scanCount; i++) {
                    // 支持 4 种命名格式
                    const paths = [
                        `./images/${i}.jpg`,      // 无括号 JPG
                        `./images/${i}.png`,      // 无括号 PNG
                        `./images/(${i}).jpg`,    // 带括号 JPG
                        `./images/(${i}).png`     // 带括号 PNG
                    ];
                    
                    let loaded = false;
                    let attemptCount = 0;
                    
                    // 尝试所有路径
                    const tryLoadPath = (index) => {
                        if (index >= paths.length || loaded) return;
                        
                        const path = paths[index];
                        attemptCount++;
                        
                        loader.load(path,
                            (t) => {
                                if (!loaded) {
                                    t.colorSpace = THREE.SRGBColorSpace;
                                    addPhotoToScene(t, path);
                                    loadedCount++;
                                    loaded = true;
                                    console.log(`✅ 图片加载成功 (${loadedCount}): ${path}`);
                                }
                            },
                            undefined,
                            (error) => {
                                // 当前路径失败，尝试下一个
                                tryLoadPath(index + 1);
                                
                                // 所有路径都失败了
                                if (index === paths.length - 1 && !loaded) {
                                    failedCount++;
                                    console.log(`⚠️  图片 ${i} 未找到 (尝试了所有格式)`);
                                }
                            }
                        );
                    };
                    
                    tryLoadPath(0);
                }
                
                // 延迟显示统计信息
                setTimeout(() => {
                    console.log(`\n📊 图片加载统计 (数字扫描模式):`);
                    console.log(`   ✅ 成功加载: ${loadedCount} 张`);
                    console.log(`   ❌ 未找到: ${failedCount} 个编号`);

        function createTextures() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,128,128);
            ctx.fillStyle = '#880000'; 
            ctx.beginPath();
            for(let i=-128; i<256; i+=32) {
                ctx.moveTo(i, 0); ctx.lineTo(i+32, 128); ctx.lineTo(i+16, 128); ctx.lineTo(i-16, 0);
            }
            ctx.fill();
            caneTexture = new THREE.CanvasTexture(canvas);
            caneTexture.wrapS = THREE.RepeatWrapping;
            caneTexture.wrapT = THREE.RepeatWrapping;
            caneTexture.repeat.set(3, 3);
        }
// wp/electronicminer wish you a Merry Christmas!

        function createSnow() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const velocities = [];

            const loader = new THREE.TextureLoader();
            // 创建一个简单的圆形纹理作为雪花
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;

            context.beginPath();
            context.arc(16, 16, 16, 0, Math.PI * 2);

            const snowTexture = new THREE.CanvasTexture(canvas);

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                const x = THREE.MathUtils.randFloatSpread(100);
                const y = THREE.MathUtils.randFloatSpread(60);

                vertices.push(x, y, z);
                
                // 存储每个雪花的速度和摆动参数
                velocities.push(
                    Math.random() * 0.2 + 0.1, // fall speed
                    Math.random() * 0.05       // sway speed
                );
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('userData', new THREE.Float32BufferAttribute(velocities, 2));

                size: 0.4,
                map: snowTexture,
                transparent: true,
                opacity: 0.8,

        function updateSnow() {
            if (!snowSystem) return;
            
            const positions = snowSystem.geometry.attributes.position.array;
            const userData = snowSystem.geometry.attributes.userData.array;

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                // Y轴下落
                const fallSpeed = userData[i * 2];
                positions[i * 3 + 1] -= fallSpeed;

                // X轴摇摆
                const swaySpeed = userData[i * 2 + 1];
                positions[i * 3] += Math.sin(clock.elapsedTime * 2 + i) * swaySpeed * 0.1;

                // 循环重置
                if (positions[i * 3 + 1] < -30) {
                    positions[i * 3 + 1] = 30;
                    positions[i * 3] = THREE.MathUtils.randFloatSpread(100);
                    positions[i * 3 + 2] = THREE.MathUtils.randFloatSpread(60);
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
        }

        const FIREWORK_VS = `
            attribute vec3 aColor; attribute float aAlpha; attribute float aSize; attribute float aPhase;
            varying vec3 vColor; varying float vAlpha; varying float vPhase;
            void main() {
                vColor = aColor; vAlpha = aAlpha; vPhase = aPhase;
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = aSize * (600.0 / max(-mv.z, 0.001));
                gl_Position = projectionMatrix * mv;
            }`;
        const FIREWORK_FS = `
            precision highp float;
            uniform float uTime;
            varying vec3 vColor; varying float vAlpha; varying float vPhase;
            void main() {
                vec2 pc = gl_PointCoord - 0.5;
                float r2 = dot(pc, pc);
                if (r2 > 0.25) discard;
                float r = sqrt(r2) * 2.0;
                float softGlow = pow(1.0 - r, 3.0) * 0.8;
                float core = pow(1.0 - r, 12.0) * 1.0;
                float intensity = min(1.0, (softGlow + core)) * vAlpha;
                if (vPhase >= 0.0) {
                    float blink = step(0.1, sin(uTime * 45.0 + vPhase * 62.8));
                    intensity *= mix(0.3, 1.0, blink);
                }
                gl_FragColor = vec4(vColor * 1.4, intensity);
            }`;

        class Explosion {
            static TYPE_TABLE = {
                PEONY:         { count: 500,  gravity: 4.0, drag: 0.965, speedMin: 12, speedRange: 24, life: 3.0, baseSize: 0.80, sparkle: 0.05, trailLife: 0.55 },
                CHRYSANTHEMUM: { count: 600,  gravity: 3.0, drag: 0.955, speedMin: 10, speedRange: 20, life: 3.8, baseSize: 0.70, sparkle: 0.40, trailLife: 1.20 },
                WILLOW:        { count: 400,  gravity: 1.2, drag: 0.945, speedMin: 6,  speedRange: 14, life: 6.5, baseSize: 0.60, sparkle: 1.00, trailLife: 2.20 },
                PALM:          { count: 300,  gravity: 5.5, drag: 0.930, speedMin: 15, speedRange: 20, life: 3.8, baseSize: 0.85, sparkle: 0.10, trailLife: 1.30 },
                CROSSETTE:     { count: 380,  gravity: 4.0, drag: 0.965, speedMin: 12, speedRange: 24, life: 2.6, baseSize: 0.82, sparkle: 0.10, trailLife: 0.65 },
                STROBE:        { count: 450,  gravity: 2.2, drag: 0.975, speedMin: 10, speedRange: 20, life: 4.8, baseSize: 0.72, sparkle: 1.00, trailLife: 0.60 },
                RING:          { count: 380,  gravity: 2.5, drag: 0.975, speedMin: 14, speedRange: 14, life: 3.2, baseSize: 0.75, sparkle: 0.10, trailLife: 0.50 },
                PISTIL:        { count: 600,  gravity: 4.0, drag: 0.965, speedMin: 12, speedRange: 24, life: 3.2, baseSize: 0.80, sparkle: 0.05, trailLife: 0.60 },
            };
            static SUB_CONFIG = { count: 100, gravity: 4.0, drag: 0.96, speedMin: 4, speedRange: 5, life: 1.2, baseSize: 0.55, sparkle: 0.10, trailLife: 0.30 };
            static TRAIL_MAX = 4000;

            constructor(position, color, type, sceneRef, isSub = false) {
                this.position = position.clone();
                this.type = type;
                this.sceneRef = sceneRef;
                this.isSub = isSub;
                this.cfg = isSub ? Explosion.SUB_CONFIG : (Explosion.TYPE_TABLE[type] || Explosion.TYPE_TABLE.PEONY);
                this.maxLife = this.cfg.life;
                this.life = this.maxLife;
                this.alive = true;
                this.secondStageTriggered = false;
                this.subExplosions = [];
                this._initParticles();
                if (!isSub && this.cfg.trailLife > 0) this._initTrails();
            }

            _initParticles() {
                const cfg = this.cfg;
                const count = cfg.count;
                this.count = count;
                const pos = new Float32Array(count * 3);
                const col = new Float32Array(count * 3);
                const alp = new Float32Array(count);
                const siz = new Float32Array(count);
                const pha = new Float32Array(count);
                this.velocities = [];
                this.baseSizes = new Float32Array(count);

                const palette = CONFIG.firework.colors;
                const colorCount = this.isSub ? 1 : THREE.MathUtils.randInt(CONFIG.firework.palettePerExplosionMin, CONFIG.firework.palettePerExplosionMax);
                const selectedColors = [];
                for (let c = 0; c < colorCount; c++) {
                    selectedColors.push(new THREE.Color(palette[Math.floor(Math.random() * palette.length)]));
                }
                const pistilColor = (this.type === 'PISTIL')
                    ? new THREE.Color(palette[Math.floor(Math.random() * palette.length)])
                    : null;
                const pistilStart = (this.type === 'PISTIL') ? Math.floor(count * 0.7) : count;

                for (let i = 0; i < count; i++) {
                    pos[i * 3] = this.position.x;
                    pos[i * 3 + 1] = this.position.y;
                    pos[i * 3 + 2] = this.position.z;

                    const isPistilCore = i >= pistilStart;
                    const speed = isPistilCore
                        ? (cfg.speedMin * 0.45 + Math.random() * cfg.speedRange * 0.3)
                        : (cfg.speedMin + Math.random() * cfg.speedRange);
                    const dir = this._getDirection(i, count);
                    this.velocities.push(dir.normalize().multiplyScalar(speed));

                    const baseCol = isPistilCore ? pistilColor : selectedColors[i % colorCount];
                    const hsl = {};
                    baseCol.getHSL(hsl);
                    const h = (hsl.h + (Math.random() - 0.5) * (30 / 360) + 1) % 1;
                    const s = THREE.MathUtils.clamp(hsl.s + (Math.random() - 0.5) * 0.15, 0.6, 1);
                    const l = 0.55 + Math.random() * 0.25;
                    const pc = new THREE.Color().setHSL(h, s, l);
                    col[i * 3] = pc.r; col[i * 3 + 1] = pc.g; col[i * 3 + 2] = pc.b;

                    alp[i] = 1.0;
                    const sizeJitter = 0.7 + Math.random() * 0.6;
                    this.baseSizes[i] = cfg.baseSize * sizeJitter * (isPistilCore ? 0.85 : 1.0);
                    siz[i] = this.baseSizes[i];
                    pha[i] = Math.random() < cfg.sparkle ? Math.random() * Math.PI * 2 : -1.0;
                }

                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
                geo.setAttribute('aAlpha', new THREE.BufferAttribute(alp, 1));
                geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(pha, 1));
                geo.attributes.position.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aAlpha.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aSize.setUsage(THREE.DynamicDrawUsage);

                this.material = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 } },
                    vertexShader: FIREWORK_VS,
                    fragmentShader: FIREWORK_FS,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.points = new THREE.Points(geo, this.material);
                this.sceneRef.add(this.points);
            }

            _initTrails() {
                const n = Explosion.TRAIL_MAX;
                this.trailIdx = 0;
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
                geo.setAttribute('aColor', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
                geo.setAttribute('aAlpha', new THREE.BufferAttribute(new Float32Array(n), 1));
                geo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(n), 1));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(new Float32Array(n).fill(-1), 1));
                geo.attributes.position.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aColor.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aAlpha.setUsage(THREE.DynamicDrawUsage);
                geo.attributes.aSize.setUsage(THREE.DynamicDrawUsage);
                this.trailPoints = new THREE.Points(geo, this.material);
                this.sceneRef.add(this.trailPoints);
            }

            _getDirection(i, count) {
                const d = new THREE.Vector3().randomDirection();
                switch (this.type) {
                    case 'RING': {
                        const a = (i / count) * Math.PI * 2;
                        return new THREE.Vector3(Math.cos(a), THREE.MathUtils.randFloatSpread(0.08), Math.sin(a));
                    }
                    case 'PALM': {
                        d.y = Math.abs(d.y) * 0.4 + 0.55;
                        return d;
                    }
                    case 'WILLOW': {
                        d.y = Math.abs(d.y) * 0.25 + 0.05;
                        return d;
                    }
                    case 'CROSSETTE': {
                        const arms = 8;
                        const arm = i % arms;
                        const armAngle = (arm / arms) * Math.PI * 2;
                        const lift = THREE.MathUtils.randFloatSpread(0.25);
                        return new THREE.Vector3(Math.cos(armAngle), lift, Math.sin(armAngle));
                    }
                    default:
                        return d;
                }
            }

            update(dt) {
                if (!this.alive) return;
                this.life -= dt;
                const progress = Math.max(0, this.life / this.maxLife);

                if (this.life <= 0 && this.subExplosions.every(se => !se.alive)) {
                    this.alive = false;
                    return;
                }

                this.material.uniforms.uTime.value += dt;
                const pos = this.points.geometry.attributes.position.array;
                const alp = this.points.geometry.attributes.aAlpha.array;
                const siz = this.points.geometry.attributes.aSize.array;
                const gravity = this.cfg.gravity;
                const drag = this.cfg.drag;

                for (let i = 0; i < this.count; i++) {
                    const v = this.velocities[i];
                    v.y -= gravity * dt;
                    v.x += THREE.MathUtils.randFloatSpread(0.2);
                    v.z += THREE.MathUtils.randFloatSpread(0.2);
                    v.multiplyScalar(drag);
                    pos[i * 3] += v.x * dt;
                    pos[i * 3 + 1] += v.y * dt;
                    pos[i * 3 + 2] += v.z * dt;
                    alp[i] = Math.pow(progress, 1.5);
                    siz[i] = this.baseSizes[i] * (0.6 + 0.4 * progress);
                }

                this.points.geometry.attributes.position.needsUpdate = true;
                this.points.geometry.attributes.aAlpha.needsUpdate = true;
                this.points.geometry.attributes.aSize.needsUpdate = true;

                if (this.trailPoints && progress > 0) this._updateTrails(dt, pos, alp, siz);

                if (this.type === 'CROSSETTE' && !this.secondStageTriggered && (1 - progress) >= 0.45) {
                    this.secondStageTriggered = true;
                    const palette = CONFIG.firework.colors;
                    const arms = 8;
                    for (let k = 0; k < arms; k++) {
                        const ri = Math.floor((k / arms) * this.count + Math.random() * (this.count / arms));
                        const p = new THREE.Vector3(pos[ri * 3], pos[ri * 3 + 1], pos[ri * 3 + 2]);
                        this.subExplosions.push(new Explosion(p, palette[Math.floor(Math.random() * palette.length)], 'PEONY', this.sceneRef, true));
                    }
                }

                this.subExplosions.forEach(se => se.update(dt));
            }

            _updateTrails(dt, pos, alp, siz) {
                const tGeo = this.trailPoints.geometry;
                const tPos = tGeo.attributes.position.array;
                const tCol = tGeo.attributes.aColor.array;
                const tAlp = tGeo.attributes.aAlpha.array;
                const tSiz = tGeo.attributes.aSize.array;
                const pCol = this.points.geometry.attributes.aColor.array;
                const n = Explosion.TRAIL_MAX;
                const trailLife = this.cfg.trailLife;

                for (let i = 0; i < n; i++) tAlp[i] = Math.max(0, tAlp[i] - dt / trailLife);

                for (let i = 0; i < this.count; i += 4) {
                    if (alp[i] <= 0.05) continue;
                    const idx = this.trailIdx;
                    tPos[idx * 3] = pos[i * 3];
                    tPos[idx * 3 + 1] = pos[i * 3 + 1];
                    tPos[idx * 3 + 2] = pos[i * 3 + 2];
                    tCol[idx * 3] = pCol[i * 3] * 0.7;
                    tCol[idx * 3 + 1] = pCol[i * 3 + 1] * 0.7;
                    tCol[idx * 3 + 2] = pCol[i * 3 + 2] * 0.7;
                    tAlp[idx] = alp[i] * 0.7;
                    tSiz[idx] = siz[i] * 1.2;
                    this.trailIdx = (this.trailIdx + 1) % n;
                }

                tGeo.attributes.position.needsUpdate = true;
                tGeo.attributes.aColor.needsUpdate = true;
                tGeo.attributes.aAlpha.needsUpdate = true;
                tGeo.attributes.aSize.needsUpdate = true;
            }

            dispose(sceneRef) {
                sceneRef.remove(this.points);
                this.points.geometry.dispose();
                this.material.dispose();
                if (this.trailPoints) {
                    sceneRef.remove(this.trailPoints);
                    this.trailPoints.geometry.dispose();
                }
                this.subExplosions.forEach(se => se.dispose(sceneRef));
            }
        }

        class Rocket {
            static TRAIL_LEN = 80;
            static SPARK_COUNT = 25;

            constructor(startPos, targetHeight, color, type, sceneRef) {
                this.position = startPos.clone();
                this.targetHeight = targetHeight;
                this.color = color;
                this.type = type;
                this.sceneRef = sceneRef;
                this.alive = true;
                this.velocity = new THREE.Vector3(
                    THREE.MathUtils.randFloatSpread(1.5),
                    THREE.MathUtils.randFloat(18, 24),
                    THREE.MathUtils.randFloatSpread(1.5)
                );

                const sparkCount = Rocket.SPARK_COUNT;
                const sparkGeo = new THREE.BufferGeometry();
                const sparkPos = new Float32Array(sparkCount * 3);
                const sparkCol = new Float32Array(sparkCount * 3);
                const sparkAlp = new Float32Array(sparkCount);
                const sparkSiz = new Float32Array(sparkCount);
                const sparkPha = new Float32Array(sparkCount);
                this.sparkVelocities = [];

                const c = new THREE.Color(color);
                for (let i = 0; i < sparkCount; i++) {
                    sparkPos[i * 3] = this.position.x;
                    sparkPos[i * 3 + 1] = this.position.y;
                    sparkPos[i * 3 + 2] = this.position.z;
                    sparkCol[i * 3] = c.r;
                    sparkCol[i * 3 + 1] = c.g;
                    sparkCol[i * 3 + 2] = c.b;
                    sparkAlp[i] = 0.6 + Math.random() * 0.3;
                    sparkSiz[i] = 0.25 + Math.random() * 0.3;
                    sparkPha[i] = Math.random() * Math.PI * 2;
                    this.sparkVelocities.push(new THREE.Vector3(
                        THREE.MathUtils.randFloatSpread(2),
                        THREE.MathUtils.randFloatSpread(2) - 1.5,
                        THREE.MathUtils.randFloatSpread(2)
                    ));
                }

                sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
                sparkGeo.setAttribute('aColor', new THREE.BufferAttribute(sparkCol, 3));
                sparkGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sparkAlp, 1));
                sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(sparkSiz, 1));
                sparkGeo.setAttribute('aPhase', new THREE.BufferAttribute(sparkPha, 1));
                sparkGeo.attributes.position.setUsage(THREE.DynamicDrawUsage);
                sparkGeo.attributes.aAlpha.setUsage(THREE.DynamicDrawUsage);

                this.sparkMaterial = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 } },
                    vertexShader: FIREWORK_VS,
                    fragmentShader: FIREWORK_FS,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                this.sparks = new THREE.Points(sparkGeo, this.sparkMaterial);
                sceneRef.add(this.sparks);

                this.trailIdx = 0;
                this.trailBuf = new Float32Array(Rocket.TRAIL_LEN * 3);
                this.trailColBuf = new Float32Array(Rocket.TRAIL_LEN * 3);
                this.trailAlpBuf = new Float32Array(Rocket.TRAIL_LEN);
                this.trailSizBuf = new Float32Array(Rocket.TRAIL_LEN);
                this.trailPhaBuf = new Float32Array(Rocket.TRAIL_LEN).fill(-1);
                for (let i = 0; i < Rocket.TRAIL_LEN; i++) {
                    this.trailColBuf[i * 3] = c.r;
                    this.trailColBuf[i * 3 + 1] = c.g;
                    this.trailColBuf[i * 3 + 2] = c.b;
                    this.trailSizBuf[i] = 0.5 + (i / Rocket.TRAIL_LEN) * 0.3;
                }

                this.trailGeometry = new THREE.BufferGeometry();
                this.trailGeometry.setAttribute('position', new THREE.BufferAttribute(this.trailBuf, 3));
                this.trailGeometry.setAttribute('aColor', new THREE.BufferAttribute(this.trailColBuf, 3));
                this.trailGeometry.setAttribute('aAlpha', new THREE.BufferAttribute(this.trailAlpBuf, 1));
                this.trailGeometry.setAttribute('aSize', new THREE.BufferAttribute(this.trailSizBuf, 1));
                this.trailGeometry.setAttribute('aPhase', new THREE.BufferAttribute(this.trailPhaBuf, 1));
                this.trailGeometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
                this.trailGeometry.attributes.aAlpha.setUsage(THREE.DynamicDrawUsage);
                this.trailGeometry.setDrawRange(0, 0);

                this.trailMaterial = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 } },
                    vertexShader: FIREWORK_VS,
                    fragmentShader: FIREWORK_FS,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                this.trail = new THREE.Points(this.trailGeometry, this.trailMaterial);
                sceneRef.add(this.trail);
            }

            update(dt) {
                this.position.addScaledVector(this.velocity, dt);

                this.sparkMaterial.uniforms.uTime.value += dt;
                this.trailMaterial.uniforms.uTime.value += dt;

                const sPos = this.sparks.geometry.attributes.position.array;
                const sAlp = this.sparks.geometry.attributes.aAlpha.array;
                for (let i = 0; i < Rocket.SPARK_COUNT; i++) {
                    const sv = this.sparkVelocities[i];
                    sPos[i * 3] += sv.x * dt;
                    sPos[i * 3 + 1] += sv.y * dt;
                    sPos[i * 3 + 2] += sv.z * dt;
                    sAlp[i] = Math.max(0, sAlp[i] - dt * 2.0);
                }
                this.sparks.geometry.attributes.position.needsUpdate = true;
                this.sparks.geometry.attributes.aAlpha.needsUpdate = true;

                const idx = this.trailIdx % Rocket.TRAIL_LEN;
                this.trailBuf[idx * 3] = this.position.x + THREE.MathUtils.randFloatSpread(0.1);
                this.trailBuf[idx * 3 + 1] = this.position.y;
                this.trailBuf[idx * 3 + 2] = this.position.z + THREE.MathUtils.randFloatSpread(0.1);
                this.trailAlpBuf[idx] = 0.8;
                this.trailIdx++;

                for (let i = 0; i < Rocket.TRAIL_LEN; i++) {
                    this.trailAlpBuf[i] = Math.max(0, this.trailAlpBuf[i] - dt * 1.5);
                }

                this.trailGeometry.attributes.position.needsUpdate = true;
                this.trailGeometry.attributes.aAlpha.needsUpdate = true;
                this.trailGeometry.setDrawRange(0, Math.min(this.trailIdx, Rocket.TRAIL_LEN));
            }

            dispose(sceneRef) {
                sceneRef.remove(this.sparks);
                sceneRef.remove(this.trail);
                this.sparks.geometry.dispose();
                this.sparkMaterial.dispose();
                this.trailGeometry.dispose();
                this.trailMaterial.dispose();
            }
        }

        class FireworkSystem {
            constructor(sceneRef) {
                this.sceneRef = sceneRef;
                this.rockets = [];
                this.explosions = [];
                this.lastLaunchTime = 0;
                this.comboQueue = [];
                this.nextComboTime = 0;
            }

            update(dt, currentTime, isActive) {
                if (isActive && this.explosions.length < CONFIG.firework.maxExplosions) {
                    if (currentTime >= this.nextComboTime) {
                        const isCombo = Math.random() < 0.35;
                        if (isCombo) {
                            this.launchCombo();
                        } else {
                            this.launchRocket();
                        }
                        const interval = THREE.MathUtils.randInt(CONFIG.firework.launchIntervalMin, CONFIG.firework.launchIntervalMax);
                        this.nextComboTime = currentTime + interval;
                    }
                }

                this.rockets = this.rockets.filter(rocket => {
                    rocket.update(dt);
                    if (rocket.position.y >= rocket.targetHeight) {
                        this.createExplosion(rocket);
                        rocket.dispose(this.sceneRef);
                        return false;
                    }
                    return rocket.alive;
                });

                this.explosions = this.explosions.filter(explosion => {
                    explosion.update(dt);
                    if (!explosion.alive) {
                        explosion.dispose(this.sceneRef);
                        return false;
                    }
                    return true;
                });
            }

            launchRocket() {
                const x = THREE.MathUtils.randFloatSpread(CONFIG.firework.launchXRange * 2);
                const startPos = new THREE.Vector3(x, -15, THREE.MathUtils.randFloatSpread(10));
                const targetHeight = THREE.MathUtils.randFloat(CONFIG.firework.targetHeightMin, CONFIG.firework.targetHeightMax);
                const color = CONFIG.firework.colors[Math.floor(Math.random() * CONFIG.firework.colors.length)];
                const type = CONFIG.firework.types[Math.floor(Math.random() * CONFIG.firework.types.length)];
                this.rockets.push(new Rocket(startPos, targetHeight, color, type, this.sceneRef));
            }

            launchCombo() {
                const palette = CONFIG.firework.colors;
                const types = CONFIG.firework.types;
                const comboType = Math.floor(Math.random() * 4);

                switch (comboType) {
                    case 0: {
                        const count = THREE.MathUtils.randInt(3, 5);
                        const centerX = THREE.MathUtils.randFloatSpread(12);
                        for (let i = 0; i < count; i++) {
                            const x = centerX + (i - (count - 1) / 2) * THREE.MathUtils.randFloat(2, 4);
                            const startPos = new THREE.Vector3(x, -15, THREE.MathUtils.randFloatSpread(5));
                            const targetHeight = THREE.MathUtils.randFloat(10, 18);
                            const color = palette[Math.floor(Math.random() * palette.length)];
                            const type = types[Math.floor(Math.random() * types.length)];
                            this.rockets.push(new Rocket(startPos, targetHeight, color, type, this.sceneRef));
                        }
                        break;
                    }
                    case 1: {
                        const color1 = palette[Math.floor(Math.random() * palette.length)];
                        const color2 = palette[Math.floor(Math.random() * palette.length)];
                        for (let i = 0; i < 3; i++) {
                            const x = THREE.MathUtils.randFloatSpread(16);
                            const startPos = new THREE.Vector3(x, -15, THREE.MathUtils.randFloatSpread(5));
                            const targetHeight = THREE.MathUtils.randFloat(10, 16);
                            this.rockets.push(new Rocket(startPos, targetHeight, color1, 'WILLOW', this.sceneRef));
                        }
                        for (let i = 0; i < 2; i++) {
                            const x = THREE.MathUtils.randFloatSpread(16);
                            const startPos = new THREE.Vector3(x, -15, THREE.MathUtils.randFloatSpread(5));
                            const targetHeight = THREE.MathUtils.randFloat(14, 20);
                            this.rockets.push(new Rocket(startPos, targetHeight, color2, 'PEONY', this.sceneRef));
                        }
                        break;
                    }
                    case 2: {
                        const sharedColor = palette[Math.floor(Math.random() * palette.length)];
                        const heights = [8, 14, 20];
                        for (let i = 0; i < 3; i++) {
                            const x = THREE.MathUtils.randFloatSpread(8);
                            const startPos = new THREE.Vector3(x, -15, THREE.MathUtils.randFloatSpread(3));
                            this.rockets.push(new Rocket(startPos, heights[i], sharedColor, 'CHRYSANTHEMUM', this.sceneRef));
                        }
                        break;
                    }
                    case 3: {
                        for (let i = 0; i < 4; i++) {
                            const angle = (i / 4) * Math.PI * 2;
                            const radius = THREE.MathUtils.randFloat(5, 10);
                            const startPos = new THREE.Vector3(Math.cos(angle) * radius, -15, Math.sin(angle) * radius);
                            const targetHeight = THREE.MathUtils.randFloat(12, 20);
                            const color = palette[Math.floor(Math.random() * palette.length)];
                            const type = types[Math.floor(Math.random() * types.length)];
                            this.rockets.push(new Rocket(startPos, targetHeight, color, type, this.sceneRef));
                        }
                        break;
                    }
                }
            }

            createExplosion(rocket) {
                this.explosions.push(new Explosion(rocket.position, rocket.color, rocket.type, this.sceneRef));
            }

            dispose() {
                this.rockets.forEach(r => r.dispose(this.sceneRef));
                this.explosions.forEach(e => e.dispose(this.sceneRef));
                this.rockets = [];
                this.explosions = [];
            }
        }

        const _pv3 = new THREE.Vector3();
        class Particle {
            constructor(mesh, type, isDust = false) {
                this.mesh = mesh;
                this.type = type;
                this.isDust = isDust;

                this.posTree = new THREE.Vector3();
                this.posScatter = new THREE.Vector3();
                this.baseScale = mesh.scale.x;
                this.visState = 'VISIBLE';
                this.prevMode = null;

                const speedMult = (type === 'PHOTO') ? 0.3 : 2.0;

                this.spinSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult,
                    (Math.random() - 0.5) * speedMult
                );

                this.calculatePositions();
            }

            calculatePositions() {
                if (this.type === 'PHOTO') {
                    this.posTree.set(0, 0, 0); 
                    const rScatter = 8 + Math.random()*12;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(
                        rScatter * Math.sin(phi) * Math.cos(theta),
                        rScatter * Math.sin(phi) * Math.sin(theta),
                        rScatter * Math.cos(phi)
                    );
                    return;
                }

                const h = CONFIG.particles.treeHeight;
                const halfH = h / 2;
                let t = Math.random(); 
                t = Math.pow(t, 0.8); 
                const y = (t * h) - halfH;
                
                let rMax = CONFIG.particles.treeRadius * (1.0 - t); 
                if (rMax < 0.5) rMax = 0.5;

                const angle = t * 50 * Math.PI + Math.random() * Math.PI; 
                const r = rMax * (0.8 + Math.random() * 0.4); 
                this.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);

                let rScatter = this.isDust ? (12 + Math.random()*20) : (8 + Math.random()*12);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(
                    rScatter * Math.sin(phi) * Math.cos(theta),
                    rScatter * Math.sin(phi) * Math.sin(theta),
                    rScatter * Math.cos(phi)
                );
            }
// wp/electronicminer wish you a Merry Christmas!
            update(dt, mode, focusTargetMesh) {
                const entered = mode === 'FIREWORK' && this.prevMode !== 'FIREWORK';
                const exited = mode !== 'FIREWORK' && this.prevMode === 'FIREWORK';
                this.prevMode = mode;

                if (entered) this.visState = 'FADING_OUT';
                if (exited) { this.visState = 'FADING_IN'; this.mesh.visible = true; }

                if (this.visState === 'HIDDEN') return;

                const _v3 = _pv3;
                const fadeLerp = Math.min(1, 8 * dt);
                if (this.visState === 'FADING_OUT') {
                    this.mesh.scale.lerp(_v3.set(0, 0, 0), fadeLerp);
                    if (this.mesh.scale.x < 0.01) {
                        this.mesh.scale.set(0, 0, 0);
                        this.mesh.visible = false;
                        this.visState = 'HIDDEN';
                    }
                    return;
                }

                if (this.visState === 'FADING_IN') {
                    const bs = this.baseScale;
                    this.mesh.scale.lerp(_v3.set(bs, bs, bs), fadeLerp);
                    if (Math.abs(this.mesh.scale.x - bs) < 0.02) {
                        this.mesh.scale.set(bs, bs, bs);
                        this.visState = 'VISIBLE';
                    }
                    return;
                }

                let target = this.posScatter;

                if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 35);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    }
                }

                const lerpSpeed = (mode === 'FOCUS' && this.mesh === focusTargetMesh) ? 5.0 : 2.0;
                this.mesh.position.lerp(target, lerpSpeed * dt);

                if (mode === 'SCATTER') {
                    this.mesh.rotation.x += this.spinSpeed.x * dt;
                    this.mesh.rotation.y += this.spinSpeed.y * dt;
                    this.mesh.rotation.z += this.spinSpeed.z * dt;
                }

                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) {
                    this.mesh.lookAt(camera.position);
                }

                let s = this.baseScale;
                if (this.isDust) {
                    s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                } else if (mode === 'SCATTER' && this.type === 'PHOTO') {
                    s = this.baseScale * 2.5;
                } else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) s = 4.5;
                    else s = this.baseScale * 0.8;
                }

                const lerpAlpha = Math.min(1, dt / 0.2);
                this.mesh.scale.lerp(_v3.set(s, s, s), lerpAlpha);
            }
        }

        function updatePhotoLayout() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO');
            const count = photos.length;
            if (count === 0) return;

            const h = CONFIG.particles.treeHeight * 0.9;
            const bottomY = -h/2;
            const stepY = h / count;
            const loops = 3;

            photos.forEach((p, i) => {
                const y = bottomY + stepY * i + stepY/2;
                const fullH = CONFIG.particles.treeHeight;
                const normalizedH = (y + fullH/2) / fullH; 

                let rMax = CONFIG.particles.treeRadius * (1.0 - normalizedH);
                if (rMax < 1.0) rMax = 1.0;
                
                const r = rMax + 3.0; 
                const angle = normalizedH * Math.PI * 2 * loops + (Math.PI/4); 

                p.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
            });
        }

        function createDust() {
            const geo = new THREE.TetrahedronGeometry(0.08, 0);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.8 });
            
            for(let i=0; i<CONFIG.particles.dustCount; i++) {
                 const mesh = new THREE.Mesh(geo, mat);
                 mesh.scale.setScalar(0.5 + Math.random());

        function addPhotoToScene(texture, sourceUrl = null) {
            let width = 1.2;
            let height = 1.2;
            
            if (texture.image) {
                const aspect = texture.image.width / texture.image.height;
                if (aspect > 1) {
                    height = width / aspect;
                } else {
                    width = height * aspect;
                }
            }

            // 🔍 调试日志：检查纹理属性
            console.log('📸 [addPhotoToScene] 创建照片:', {
                url: sourceUrl,
                textureColorSpace: texture.colorSpace,
                hasImage: !!texture.image,
                imageSize: texture.image ? `${texture.image.width}x${texture.image.height}` : 'N/A'
            });

            // 创建金色边框（受光照影响）
            const borderWidth = width * 1.15;  // 边框比照片大 15%
            const borderHeight = height * 1.15;
            const borderGeo = new THREE.PlaneGeometry(borderWidth, borderHeight);
            const borderMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700,  // 金色
                metalness: 0.8,
                roughness: 0.2,
                side: THREE.DoubleSide,
                emissive: 0x443300,

                // 🔧 修复：降低边框自发光强度，避免触发 Bloom
                emissiveIntensity: 0.05  // 从 0.1 降至 0.05
            });
            const border = new THREE.Mesh(borderGeo, borderMat.clone());
            borderMat.dispose();
            border.position.z = -0.01;  // 边框在照片后面
            border.renderOrder = 998;  // 边框在照片之前渲染

            // 创建照片（不受光照影响）
            const photoGeo = new THREE.PlaneGeometry(width, height);
            const photoMat = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                toneMapped: false,  // 关键：禁用色调映射，保持原始颜色
                
                // 🔧 修复：优化渲染顺序和深度测试
                // renderOrder 越大越晚渲染，确保照片在后处理前最后渲染
                // depthWrite: false 避免照片影响其他物体的深度测试
            });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = 0.01;  // 照片在前面
            photo.renderOrder = 999;  // 最高渲染优先级，最后渲染
            
            // 🔧 修复：设置照片图层，便于后续选择性渲染
            photo.layers.enable(0);  // 默认图层
            photo.layers.enable(1);  // 照片专用图层

            // 🔍 调试日志：检查照片材质属性
            console.log('🎨 [addPhotoToScene] 照片材质配置 (已优化):', {
                type: photoMat.type,
                toneMapped: photoMat.toneMapped,
                side: photoMat.side,
                renderOrder: photo.renderOrder,
                layers: photo.layers.mask,
                note: 'renderOrder=999 确保最后渲染，减少后处理影响'
            });

            // 组合边框和照片
            const group = new THREE.Group();
            group.add(border);
            group.add(photo);

            const s = 0.8;
            group.scale.set(s,s,s);
            group.userData.baseScale = s * 2.5;

            photoMeshGroup.add(group);
            const particle = new Particle(group, 'PHOTO', false);
            particleSystem.push(particle);

            // 保存照片元数据
            const photoData = {
                id: photoIdCounter++,
                url: sourceUrl || texture.image?.src || 'data:image',
                texture: texture,
                particle: particle,
                isVisible: true
            };
            photoDataArray.push(photoData);

            updatePhotoLayout();
            return photoData;
        }
        // wp/electronicminer wish you a Merry Christmas!
        function handleImageUpload(e) {
            const files = e.target.files;
            if(!files.length) return;
            
            Array.from(files).forEach(f => {
                if (!f.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t, ev.target.result);
                    });
                }
                reader.readAsDataURL(f);
            });
        }

        // --- 新增：照片管理功能 ---
        function removePhotoFromScene(photoData) {
            if (!photoData || !photoData.isVisible) return;

            // 从场景中移除mesh
            const particle = photoData.particle;
            if (particle && particle.mesh) {
                if (STATE.candidateTarget === particle.mesh) {
                    STATE.candidateTarget = null;
                }

                if (STATE.focusTarget === particle.mesh) {
                    STATE.focusTarget = null;
                    STATE.mode = 'SCATTER';
                }

                const removedPhotoIdx = particleSystem
                    .filter(p => p.type === 'PHOTO')
                    .indexOf(particle);

                photoMeshGroup.remove(particle.mesh);

                const index = particleSystem.indexOf(particle);
                if (index > -1) {
                    particleSystem.splice(index, 1);

                    const photoCount = particleSystem.filter(p => p.type === 'PHOTO').length;
                    if (photoCount === 0) {
                        STATE.focusIndex = -1;
                    } else if (removedPhotoIdx <= STATE.focusIndex) {
                        STATE.focusIndex--;
                    } else if (STATE.focusIndex >= photoCount) {
                        STATE.focusIndex = photoCount - 1;
                    }
                }

                // 清理几何体和材质
                if (particle.mesh.children) {
                    particle.mesh.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (child.material.map) child.material.map.dispose();
                            child.material.dispose();
                        }
                    });
                }
            }

            // 标记为不可见
            photoData.isVisible = false;

            // 重新布局剩余照片
            updatePhotoLayout();
        }

        function openPhotoManager() {
            const modal = document.getElementById('photo-manager-modal');
            const grid = document.getElementById('photo-grid');
            const count = document.getElementById('photo-count');
            
            // 清空网格
            grid.innerHTML = '';
            
            // 获取所有可见照片
            const visiblePhotos = photoDataArray.filter(p => p.isVisible);
            count.textContent = `Total Photos: ${visiblePhotos.length}`;
            
            if (visiblePhotos.length === 0) {
                grid.innerHTML = '<div style="color: rgba(255, 69, 0, 0.5); text-align: center; padding: 40px; grid-column: 1/-1;">No photos available</div>';
            } else {
                visiblePhotos.forEach(photoData => {
                    const item = document.createElement('div');
                    item.className = 'photo-item';
                    
                    // 创建缩略图
                    const img = document.createElement('img');
                    
                    // 处理不同类型的图片源
                    if (photoData.texture && photoData.texture.image) {
                        if (photoData.texture.image instanceof HTMLImageElement) {
                            img.src = photoData.texture.image.src;
                        } else if (photoData.texture.image instanceof HTMLCanvasElement) {
                            img.src = photoData.texture.image.toDataURL();
                        } else {
                            img.src = photoData.url;
                        }
                    } else {
                        img.src = photoData.url;
                    }
                    
                    img.alt = 'Photo';
                    img.onerror = () => {
                        img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23333" width="100" height="100"/><text x="50" y="50" text-anchor="middle" fill="%23ff4500" font-size="12">Image</text></svg>';
                    };
                    
                    // 创建删除覆盖层
                    const overlay = document.createElement('div');
                    overlay.className = 'delete-overlay';
                    overlay.innerHTML = '<div class="delete-icon">✕</div>';
                    
                    item.appendChild(img);
                    item.appendChild(overlay);
                    
                    // 点击删除
                    item.addEventListener('click', () => {
                        if (confirm('Delete this photo from the scene?\n(This will NOT delete the file from your ./images/ folder)')) {
                            removePhotoFromScene(photoData);
                            item.remove();
                            
                            // 更新计数
                            const newVisiblePhotos = photoDataArray.filter(p => p.isVisible);
                            count.textContent = `Total Photos: ${newVisiblePhotos.length}`;
                            
                            if (newVisiblePhotos.length === 0) {
                                grid.innerHTML = '<div style="color: rgba(255, 69, 0, 0.5); text-align: center; padding: 40px; grid-column: 1/-1;">No photos available</div>';
                            }
                        }
                    });
                    
                    grid.appendChild(item);
                });
            }
            
            modal.classList.add('active');
        }

        function closePhotoManager() {
            const modal = document.getElementById('photo-manager-modal');
            modal.classList.remove('active');
        }

        // --- MEDIAPIPE (Adaptive Fix) ---
        async function initMediaPipe() {
            video = document.getElementById('webcam');
            
            // Adjust to get best available resolution if possible
            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    frameRate: { ideal: 30 }
                }
            };

            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
            
            if (navigator.mediaDevices?.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                    debugInfo.innerText = "Webcam active. Show hand.";
                } catch(e) {
                    console.warn("Webcam access denied or not available", e);
                    debugInfo.innerText = "Camera error: " + e.message;
                    document.getElementById('webcam-wrapper').style.display = 'none';
                }
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    processGestures(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        // 修复核心：使用相对比例而非绝对距离
        function processGestures(result) {
            if (!(result.landmarks && result.landmarks.length > 0)) {
                STATE.hand.detected = false;
                STATE.mode = 'SCATTER';
                STATE.focusTarget = null;
                focusGestureFrameCount = 0;
                focusGestureReleaseFrameCount = 0;
                fireworkGestureFrameCount = 0;
                resetHandRotationTracking();
                debugInfo.innerText = "No hand detected";
                return;
            }

            const lm = result.landmarks[0];
            const thumb = lm[4];
            const indexTip = lm[8];
            const wrist = lm[0];
            const middleMCP = lm[9]; // 中指指根 (Knuckle)

            // 1. 计算手掌基准大小 (手腕到中指指根的距离)
            const handSize = Math.hypot(middleMCP.x - wrist.x, middleMCP.y - wrist.y);
            if (handSize < 0.02) {
                STATE.hand.detected = false;
                STATE.mode = 'SCATTER';
                STATE.focusTarget = null;
                focusGestureFrameCount = 0;
                focusGestureReleaseFrameCount = 0;
                fireworkGestureFrameCount = 0;
                resetHandRotationTracking();
                debugInfo.innerText = "Hand too small";
                return;
            }

            STATE.hand.detected = true;
            STATE.hand.x = (middleMCP.x - 0.5) * 2;
            STATE.hand.y = (middleMCP.y - 0.5) * 2;

            // 2. 计算手指尖端的平均伸展距离
            const tips = [lm[8], lm[12], lm[16], lm[20]];
            const tipDistances = tips.map(t => Math.hypot(t.x - wrist.x, t.y - wrist.y));
            const avgTipDist = tipDistances.reduce((s, d) => s + d, 0) / tipDistances.length;

            // 3. 计算捏合距离 (拇指到食指)
            const pinchDist = Math.hypot(thumb.x - indexTip.x, thumb.y - indexTip.y);

            // 4. 计算相对比例
            const extensionRatio = avgTipDist / handSize;
            const pinchRatio = pinchDist / handSize;
            const vGesture = isVGesture(lm, handSize);
            const fireworkCandidate =
                extensionRatio > FIREWORK_EXTENSION_THRESHOLD &&
                tipDistances.every(d => d > handSize * FIREWORK_MIN_FINGER_THRESHOLD);

            // 调试显示
            debugInfo.innerText =
                `Size: ${handSize.toFixed(2)} | Ext: ${extensionRatio.toFixed(2)} | ` +
                `V: ${vGesture ? '1' : '0'} | Pinch: ${pinchRatio.toFixed(2)} | Mode: ${STATE.mode}`;

            // 5. 状态判定：比耶进入 FOCUS，比耶释放退出 FOCUS
            if (vGesture) {
                focusGestureFrameCount = Math.min(focusGestureFrameCount + 1, FOCUS_ENTER_FRAMES);
                focusGestureReleaseFrameCount = 0;
                fireworkGestureFrameCount = 0;

                if (focusGestureFrameCount >= FOCUS_ENTER_FRAMES && STATE.mode !== 'FOCUS') {
                    const photos = particleSystem.filter(p => p.type === 'PHOTO');
                    if (photos.length === 0) {
                        STATE.mode = 'SCATTER';
                        STATE.focusTarget = null;
                    } else {
                        if (STATE.focusIndex === -1) {
                            const candidateIdx = STATE.candidateTarget
                                ? photos.findIndex(p => p.mesh === STATE.candidateTarget)
                                : -1;
                            STATE.focusIndex = candidateIdx !== -1 ? candidateIdx : 0;
                        } else {
                            STATE.focusIndex = (STATE.focusIndex + 1) % photos.length;
                        }
                        STATE.candidateTarget = null;
                        STATE.mode = 'FOCUS';
                        STATE.focusTarget = photos[STATE.focusIndex].mesh;
                        resetHandRotationTracking();
                    }
                }
            } else {
                focusGestureFrameCount = 0;

                if (STATE.mode === 'FOCUS') {
                    focusGestureReleaseFrameCount++;
                    if (focusGestureReleaseFrameCount >= FOCUS_EXIT_FRAMES) {
                        exitFocusMode();
                    }
                } else {
                    focusGestureReleaseFrameCount = 0;
                }

                if (STATE.mode !== 'FOCUS') {
                    if (extensionRatio < SCATTER_EXTENSION_THRESHOLD) {
                        fireworkGestureFrameCount = 0;
                        STATE.mode = 'SCATTER';
                        STATE.focusTarget = null;
                    } else if (fireworkCandidate) {
                        fireworkGestureFrameCount = Math.min(
                            fireworkGestureFrameCount + 1,
                            FIREWORK_ENTER_FRAMES
                        );
                        if (fireworkGestureFrameCount >= FIREWORK_ENTER_FRAMES) {
                            STATE.mode = 'FIREWORK';
                            STATE.focusTarget = null;
                            STATE.candidateTarget = null;
                        }
                    } else {
                        fireworkGestureFrameCount = 0;
                    }
                }
            }

            // 增量旋转更新
            if (STATE.mode === 'SCATTER' || STATE.mode === 'FIREWORK') {
                updateRotationFromHand(STATE.hand.x);
            } else {
                resetHandRotationTracking();
            }
        }
// wp/electronicminer wish you a Merry Christmas!
        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            
            document.getElementById('file-input').addEventListener('change', handleImageUpload);
            document.getElementById('folder-input').addEventListener('change', handleImageUpload);
            
            // 照片管理按钮
            document.getElementById('manage-photos-btn').addEventListener('click', openPhotoManager);
            document.getElementById('close-modal-btn').addEventListener('click', closePhotoManager);
            
            // 点击模态框背景关闭
            document.getElementById('photo-manager-modal').addEventListener('click', (e) => {
                if (e.target.id === 'photo-manager-modal') {
                    closePhotoManager();
                }
            });
            
            // ESC键关闭模态框
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closePhotoManager();
                }
                
                if (e.key.toLowerCase() === 'h') {
                    const controls = document.querySelector('.controls-wrapper');
                    if (controls) controls.classList.toggle('ui-hidden');
                    const webcam = document.getElementById('webcam-wrapper');
                    if(webcam) webcam.classList.toggle('ui-hidden');
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const currentTime = performance.now();

            // Rotation Logic: Y 轴由 processGestures() 更新 targetY，render 帧平滑追踪
            if ((STATE.mode === 'SCATTER' || STATE.mode === 'FIREWORK') && STATE.hand.detected) {
                const targetRotX = STATE.hand.y * ROTATION_X_LIMIT;
                STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.0 * dt;
            } else {
                if (STATE.mode !== 'FOCUS') {
                    STATE.rotation.targetY += 0.1 * dt;
                } else {
                    STATE.rotation.targetY = STATE.rotation.y;
                }
                STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt;
            }

            STATE.rotation.y += (STATE.rotation.targetY - STATE.rotation.y) * ROTATION_RENDER_SMOOTHING * dt;

            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;

            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget));

            mainGroup.updateMatrixWorld(true);
            camera.updateMatrixWorld();

            if (STATE.mode === 'SCATTER') {
                updateCandidatePhoto();
            } else if (STATE.mode === 'FIREWORK') {
                STATE.candidateTarget = null;
            }

            updateSnow();
            fireworkSystem.update(dt, currentTime, STATE.mode === 'FIREWORK');

            composer.render();
        }
// wp/electronicminer wish you a Merry Christmas!
        init();
    </script>
