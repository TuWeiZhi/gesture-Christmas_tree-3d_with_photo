                this.posScatter.set(
                    rScatter * Math.sin(phi) * Math.cos(theta),
                    rScatter * Math.sin(phi) * Math.sin(theta),
                    rScatter * Math.cos(phi)
                );
            }
// wp/electronicminer wish you a Merry Christmas!
            update(dt, mode, focusTargetMesh, fireworkPulseProgress = 1) {
                const entered = mode === 'FIREWORK' && this.prevMode !== 'FIREWORK';
                const exited = mode !== 'FIREWORK' && this.prevMode === 'FIREWORK';
                this.prevMode = mode;

                if (entered) {
                    const shouldHide = !this.isDust;
                    this.fireworkPulseDone = shouldHide;
                    if (!this.themeVisible) {
                        this.visState = 'HIDDEN';
                    } else if (shouldHide) {
                        this.visState = 'FADING_OUT';
                    } else {
                        this.visState = 'VISIBLE';
                    }
                    this.mesh.visible = this.themeVisible;
                }
                if (exited) {
                    this.fireworkPulseDone = false;
                    this.visState = this.themeVisible ? 'FADING_IN' : 'HIDDEN';
                    this.mesh.visible = this.themeVisible;
                }

                const _v3 = _pv3;
                const fadeSpeed = mode === 'FIREWORK' && !this.isDust ? 14 : 8;
                const fadeLerp = Math.min(1, fadeSpeed * dt);

                // 主题切换：被隐藏的粒子缩没后驻留 HIDDEN；被显示的粒子缩现
                if (!this.themeVisible) {
                    if (this.visState === 'HIDDEN') return;
                    this.mesh.scale.lerp(_v3.set(0, 0, 0), fadeLerp);
                    if (this.mesh.scale.x < 0.01) {
                        this.mesh.scale.set(0, 0, 0);
                        this.mesh.visible = false;
                        this.visState = 'HIDDEN';
                    }
                    return;
                }
                if (this.themeVisible && this.visState === 'HIDDEN') {
                    if (mode === 'FIREWORK' && !this.isDust) return;
                    this.mesh.visible = true;
                    this.visState = 'FADING_IN';
                }

                if (this.visState === 'HIDDEN') return;

                if (mode === 'FIREWORK' && !this.fireworkPulseDone) {
                    const progress = THREE.MathUtils.clamp(fireworkPulseProgress, 0, 1);
                    if (progress < 1) {
                        const eased = 1 - Math.pow(1 - progress, 3);
                        const expand = THREE.MathUtils.lerp(1, FIREWORK_PULSE_EXPANSION, eased);
                        const target = _v3.copy(this.posScatter).multiplyScalar(expand);
                        this.mesh.position.lerp(target, Math.min(1, 3.5 * dt));

                        this.mesh.rotation.x += this.spinSpeed.x * dt * 0.55;
                        this.mesh.rotation.y += this.spinSpeed.y * dt * 0.55;
                        this.mesh.rotation.z += this.spinSpeed.z * dt * 0.55;

                        let pulseScale = this.baseScale;
                        if (this.isDust) {
                            pulseScale = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                        }
                        const s = THREE.MathUtils.lerp(pulseScale, this.baseScale * FIREWORK_PULSE_MIN_SCALE, eased);
                        this.mesh.scale.lerp(_v3.set(s, s, s), Math.min(1, dt / 0.18));
                        return;
                    }

                    this.fireworkPulseDone = true;
                    this.visState = 'VISIBLE';
                }

                if (this.visState === 'FADING_OUT') {
                    this.mesh.scale.lerp(_v3.set(0, 0, 0), fadeLerp);
                    if (this.mesh.scale.x < 0.01) {
                        this.mesh.scale.set(0, 0, 0);
                        this.mesh.visible = false;
                        this.visState = 'HIDDEN';
                    }
                    return;
                }

                if (this.visState === 'FADING_IN') {
                    const bs = this.baseScale;
                    this.mesh.scale.lerp(_v3.set(bs, bs, bs), fadeLerp);
                    if (Math.abs(this.mesh.scale.x - bs) < 0.02) {
                        this.mesh.scale.set(bs, bs, bs);
                        this.visState = 'VISIBLE';
                    }
                    return;
                }

                let target = mode === 'FIREWORK'
                    ? _v3.copy(this.posScatter).multiplyScalar(FIREWORK_BACKDROP_POSITION_SCALE)
                    : this.posScatter;

                if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 35);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    }
                }

                const lerpSpeed = (mode === 'FOCUS' && this.mesh === focusTargetMesh) ? 5.0 : 2.0;
                this.mesh.position.lerp(target, lerpSpeed * dt);

                if (mode === 'SCATTER' || (mode === 'FIREWORK' && this.isDust)) {
                    const spinScale = mode === 'FIREWORK' ? FIREWORK_BACKDROP_SPIN : 1.0;
                    this.mesh.rotation.x += this.spinSpeed.x * dt * spinScale;
                    this.mesh.rotation.y += this.spinSpeed.y * dt * spinScale;
                    this.mesh.rotation.z += this.spinSpeed.z * dt * spinScale;
                }

                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) {
                    this.mesh.lookAt(camera.position);
                }

                let s = this.baseScale;
                if (mode === 'FIREWORK' && this.isDust) {
                    const breath = 0.86 + 0.14 * Math.sin(clock.elapsedTime * 1.6 + this.mesh.id);
                    s = this.baseScale * FIREWORK_DUST_SCALE * breath;
                } else if (this.isDust) {
                    s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                } else if (mode === 'SCATTER' && this.type === 'PHOTO') {
                    s = this.baseScale * 2.5;
                } else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) s = 4.5;
                    else s = this.baseScale * 0.8;
                }

                const lerpAlpha = Math.min(1, dt / 0.2);
                this.mesh.scale.lerp(_v3.set(s, s, s), lerpAlpha);

                // 生日点缀：蛋糕火焰摇曳 / 星星呼吸闪烁
                if (this.type === 'CAKE') {
                    if (!this._flameMesh) {
                        this._flameMesh = this.mesh.children.find(c => c.userData.isCakeFlame) || null;
                    }
                    if (this._flameMesh) {
                        const t = clock.elapsedTime;
                        const flick = 0.82 + 0.26 * Math.sin(t * 11 + this.mesh.id * 1.7) * Math.sin(t * 5.3 + this.mesh.id);
                        this._flameMesh.scale.set(1, flick, 1);
                        this._flameMesh.position.y = 0.52 + 0.014 * Math.sin(t * 13 + this.mesh.id);
                    }
                } else if (this.type === 'STAR' && this.mesh.material && this.mesh.material.emissive) {
                    const t = clock.elapsedTime;
                    this.mesh.material.emissiveIntensity = 0.10 + 0.30 * (0.5 + 0.5 * Math.sin(t * 2.2 + this.mesh.id * 2.1));
                }
            }
        }

        function updatePhotoLayout() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO');
            const count = photos.length;
            if (count === 0) return;

            const h = CONFIG.particles.treeHeight * 0.9;
            const bottomY = -h/2;
            const stepY = h / count;
            const loops = 3;

            photos.forEach((p, i) => {
                const y = bottomY + stepY * i + stepY/2;
                const fullH = CONFIG.particles.treeHeight;
                const normalizedH = (y + fullH/2) / fullH; 

                let rMax = CONFIG.particles.treeRadius * (1.0 - normalizedH);
                if (rMax < 1.0) rMax = 1.0;
                
                const r = rMax + 3.0; 
                const angle = normalizedH * Math.PI * 2 * loops + (Math.PI/4); 

                p.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
            });
        }

        let currentGreetingTheme = 'birthday';

        // 粒子显隐 + UI/场景/烟花/彩屑全套主题联动
        // 只改 themeVisible，实际缩放淡入淡出由 Particle.update 驱动
        function applyGreetingTheme(theme, options = {}) {
            const { burst = true } = options;
            currentGreetingTheme = theme;
            particleSystem.forEach(p => {
                if (p.type === 'PHOTO' || p.isDust) return;
                p.themeVisible = (p.theme === 'common') || (p.theme === theme);
            });

            // 1) UI 配色：body data-theme 驱动 CSS 变量（标题渐变/按钮/背景）
            document.body.dataset.theme = theme;

            // 2) 场景背景与雾色目标（animate 中平滑过渡）
            themeSceneTarget.copy(THEME_VISUALS[theme].sceneColor);

            // 3) common 粒子材质换色目标由 updateThemeTransitions 读取 currentGreetingTheme

            // 4) 烟花调色板：生日切马卡龙金粉色系
            const palette = THEME_VISUALS[theme].firework;
            CONFIG.firework.colors.length = 0;
            CONFIG.firework.colors.push(...palette);

            // 5) 雪花 ↔ 彩屑：先淡出再换装
            requestSnowMode(theme === 'birthday' ? 'confetti' : 'snow');

            // 6) 转场彩屑爆开（初始加载不触发）
            if (burst) spawnThemeBurst(theme);
        }

        function requestSnowMode(mode) {
            if (!snowSystem) { snowMode = mode; return; } // 系统未建好时仅记录
            if (mode !== snowMode && mode !== snowPendingMode) snowPendingMode = mode;
        }

        // 主题切换转场：相机前方一片彩屑爆开，颜色跟随新主题
        function spawnThemeBurst(theme) {
            const colors = THEME_VISUALS[theme].burst;
            const geo = new THREE.PlaneGeometry(0.22, 0.34);
            const mats = colors.map(c => new THREE.MeshBasicMaterial({
                color: c, transparent: true, opacity: 1,
                side: THREE.DoubleSide, toneMapped: false
            }));
            const meshes = [];
            for (let i = 0; i < 90; i++) {
                const mesh = new THREE.Mesh(geo, mats[i % mats.length]);
                mesh.position.set(
                    (Math.random() - 0.5) * 8,
                    5 + (Math.random() - 0.5) * 5,
                    34 + (Math.random() - 0.5) * 5
                );
                const angle = Math.random() * Math.PI * 2;
                const speed = 5 + Math.random() * 9;
                mesh.userData.vel = new THREE.Vector3(
                    Math.cos(angle) * speed,
                    4 + Math.random() * 8,
                    Math.sin(angle) * speed * 0.4
                );
                mesh.userData.spin = new THREE.Vector3(
                    (Math.random() - 0.5) * 12,
                    (Math.random() - 0.5) * 12,
                    (Math.random() - 0.5) * 12
                );
                scene.add(mesh);
                meshes.push(mesh);
            }
            themeBurst = { meshes, mats, geo, age: 0, life: 2.4 };
        }

        function updateThemeBurst(dt) {
            if (!themeBurst) return;
            themeBurst.age += dt;
            const { meshes, mats, age, life } = themeBurst;
            const fadeStart = life * 0.55;
            if (age > fadeStart) {
                const o = Math.max(0, 1 - (age - fadeStart) / (life - fadeStart));
                mats.forEach(m => { m.opacity = o; });
            }
            for (const m of meshes) {
                m.userData.vel.y -= 5.5 * dt;                              // 重力
                m.userData.vel.multiplyScalar(1 - Math.min(1, 1.1 * dt)); // 空气阻力
                m.position.addScaledVector(m.userData.vel, dt);
                m.rotation.x += m.userData.spin.x * dt;
                m.rotation.y += m.userData.spin.y * dt;
                m.rotation.z += m.userData.spin.z * dt;
            }
            if (age >= life) {
                meshes.forEach(m => scene.remove(m));
                mats.forEach(m => m.dispose());
                themeBurst.geo.dispose();
                themeBurst = null;
            }
        }

        // 每帧主题过渡：场景背景/雾色 + common 粒子材质颜色
        function updateThemeTransitions(dt) {
            const k = Math.min(1, 1.8 * dt);
            scene.background.lerp(themeSceneTarget, k);
            scene.fog.color.lerp(themeSceneTarget, k);
            if (themeMats) {
                const target = THEME_VISUALS[currentGreetingTheme].mats;
                themeMats.greenMat.color.lerp(target.greenMat.color, k);
                themeMats.greenMat.emissive.lerp(target.greenMat.emissive, k);
                themeMats.redMat.color.lerp(target.redMat.color, k);
                themeMats.redMat.emissive.lerp(target.redMat.emissive, k);
            }
        }

        // 复用几何：多个生日粒子共享，避免重复创建
        const _birthdayGeoCache = {};
        function birthdayGeo(key, factory) {
            return _birthdayGeoCache[key] || (_birthdayGeoCache[key] = factory());
        }

        // 五角星几何：真实星形轮廓（挤出成薄片），而非近似多面体
        function makeStarGeometry() {
            const shape = new THREE.Shape();
            const outer = 0.4, inner = 0.17, points = 5;
            for (let i = 0; i < points * 2; i++) {
                const radius = (i % 2 === 0) ? outer : inner;
                const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
                const x = Math.cos(a) * radius;
                const y = Math.sin(a) * radius;
                i === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y);
            }
            shape.closePath();
            const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.14, bevelEnabled: false });
            geo.center();
            return geo;
        }

        // 生日特色粒子：程序化构造，风格贴合现有装饰粒子
        // 内部比例 —— 气球 40% / 彩带礼盒 28% / 星星 22% / 蛋糕 10%
        function buildBirthdayMesh(ctx) {
            const { sphereGeo, boxGeo, goldMat, pickBirthdayMat, flameMat, balloonStringMat } = ctx;
            const r = Math.random();

            if (r < 0.40) {
                // 🎈 气球：水滴形（球体 + 底部锥尖）+ 下垂线绳，同色更像气球
                const mat = pickBirthdayMat();
                const group = new THREE.Group();
                const body = new THREE.Mesh(sphereGeo, mat);
                body.scale.set(0.52, 0.64, 0.52);
                const tipGeo = birthdayGeo('balloonTip', () => new THREE.ConeGeometry(0.18, 0.36, 12));
                const tip = new THREE.Mesh(tipGeo, mat);
                tip.position.y = -0.32;
                tip.rotation.x = Math.PI;
                const stringGeo = birthdayGeo('balloonString', () => new THREE.CylinderGeometry(0.012, 0.012, 0.62, 6));
                const str = new THREE.Mesh(stringGeo, balloonStringMat);
                str.position.y = -0.82; // 从锥尖下垂（尖底在 -0.5）
                group.add(body, tip, str);
                return { mesh: group, type: 'BALLOON' };
            }

            if (r < 0.68) {
                // 🎁 彩带礼盒：礼盒 + 十字缎带（加粗、金色对比）+ 顶部蝴蝶结
                const group = new THREE.Group();
                const box = new THREE.Mesh(boxGeo, pickBirthdayMat());
                const bandX = birthdayGeo('giftBandX', () => new THREE.BoxGeometry(0.62, 0.62, 0.18));
                const bandZ = birthdayGeo('giftBandZ', () => new THREE.BoxGeometry(0.18, 0.62, 0.62));
                const ribbon1 = new THREE.Mesh(bandX, goldMat);
                const ribbon2 = new THREE.Mesh(bandZ, goldMat);
                const bowGeo = birthdayGeo('giftBow', () => new THREE.SphereGeometry(0.13, 12, 12));
                const bow = new THREE.Mesh(bowGeo, goldMat);
                bow.position.y = 0.33;
                group.add(box, ribbon1, ribbon2, bow);
                return { mesh: group, type: 'GIFT_RIBBON' };
            }

            if (r < 0.90) {
                // ⭐ 星星：真实五角星，独立克隆材质以便逐颗呼吸闪烁
                const star = new THREE.Mesh(birthdayGeo('star', makeStarGeometry), pickBirthdayMat().clone());
                return { mesh: star, type: 'STAR' };
            }

            // 🎂 蛋糕：双层蛋糕体 + 蜡烛 + 自发光火焰（点缀彩蛋）
            const group = new THREE.Group();
            const tier1Geo = birthdayGeo('cakeTier1', () => new THREE.CylinderGeometry(0.34, 0.36, 0.22, 20));
            const tier2Geo = birthdayGeo('cakeTier2', () => new THREE.CylinderGeometry(0.22, 0.24, 0.18, 20));
            const tier1 = new THREE.Mesh(tier1Geo, pickBirthdayMat());
            tier1.position.y = -0.08;
            const tier2 = new THREE.Mesh(tier2Geo, pickBirthdayMat());
            tier2.position.y = 0.14;
            const candleGeo = birthdayGeo('candle', () => new THREE.CylinderGeometry(0.03, 0.03, 0.22, 8));
            const candle = new THREE.Mesh(candleGeo, goldMat);
            candle.position.y = 0.36;
            const flameGeo = birthdayGeo('flame', () => new THREE.SphereGeometry(0.06, 8, 8));
            const flame = new THREE.Mesh(flameGeo, flameMat);
            flame.position.y = 0.52;
            flame.userData.isCakeFlame = true; // 供 Particle.update 做摇曳动画
            group.add(tier1, tier2, candle, flame);
            return { mesh: group, type: 'CAKE' };
        }

        function createParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const boxGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.1, 0.5, 0), new THREE.Vector3(0.3, 0.4, 0)
            ]);
            const candyGeo = new THREE.TubeGeometry(curve, 16, 0.08, 8, false);

            const goldMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.champagneGold,
                metalness: 1.0, roughness: 0.1,
                envMapIntensity: 2.0, 
                emissive: 0x443300,   
                emissiveIntensity: 0.3
            });

            const greenMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.deepGreen,
                metalness: 0.2, roughness: 0.8,
                emissive: 0x002200,
                emissiveIntensity: 0.2 
            });

            const redMat = new THREE.MeshPhysicalMaterial({
                color: CONFIG.colors.accentRed,
                metalness: 0.3, roughness: 0.2, clearcoat: 1.0,
                emissive: 0x330000
            });
            
            const candyMat = new THREE.MeshStandardMaterial({ map: caneTexture, roughness: 0.4 });

            // 生日主题活泼配色：材质手法与金/红一致，仅换色（金属点缀 + 彩色装饰）
            const birthdayColors = [0xff6fae, 0x4fc3ff, 0x6ee7a8, 0xffe14d];
            const birthdayMats = birthdayColors.map(color => new THREE.MeshStandardMaterial({
                color,
                metalness: 0.6, roughness: 0.25,
                envMapIntensity: 1.4,
                emissive: color, emissiveIntensity: 0.12
            }));
            const flameMat = new THREE.MeshBasicMaterial({ color: 0xffcf6b, toneMapped: false });
            const balloonStringMat = new THREE.MeshBasicMaterial({ color: 0xfff2cf });
            const pickBirthdayMat = () => birthdayMats[Math.floor(Math.random() * birthdayMats.length)];

            const birthdayCtx = {
                sphereGeo, boxGeo, goldMat, pickBirthdayMat, flameMat, balloonStringMat
            };

            // common 粒子共享材质：主题切换时由 updateThemeTransitions 平滑换色
            themeMats = { greenMat, redMat };

            for (let i = 0; i < CONFIG.particles.count; i++) {
                let mesh, type, theme;

                // 生日特色粒子约占 24%，其余走通用/圣诞装饰（总数不变，密度一致）
                if (Math.random() < 0.24) {
                    ({ mesh, type } = buildBirthdayMesh(birthdayCtx));
                    theme = 'birthday';
                } else {
                    const rand = Math.random();
                    // wp/electronicminer wish you a Merry Christmas!
                    if (rand < 0.40) {
                        mesh = new THREE.Mesh(boxGeo, greenMat);
                        type = 'BOX'; theme = 'common';
                    } else if (rand < 0.70) {
                        mesh = new THREE.Mesh(boxGeo, goldMat);
                        type = 'GOLD_BOX'; theme = 'common';
                    } else if (rand < 0.92) {
                        mesh = new THREE.Mesh(sphereGeo, goldMat);
                        type = 'GOLD_SPHERE'; theme = 'common';
                    } else if (rand < 0.97) {
                        mesh = new THREE.Mesh(sphereGeo, redMat);
                        type = 'RED'; theme = 'common';
                    } else {
                        mesh = new THREE.Mesh(candyGeo, candyMat);
                        type = 'CANE'; theme = 'christmas';
                    }
                }

                if (theme === 'birthday') {
                    // 生日粒子放大且保持直立，仅随机绕 Y，避免翻滚糊成一团
                    const s = 1.15 + Math.random() * 0.45;
                    mesh.scale.set(s, s, s);
                    mesh.rotation.set(0, Math.random() * Math.PI * 2, 0);
                } else {
                    const s = 0.4 + Math.random() * 0.5;
                    mesh.scale.set(s, s, s);
                    mesh.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
                }

                mainGroup.add(mesh);
                const particle = new Particle(mesh, type, false, theme);
                if (theme === 'birthday') {
                    // 直立缓转：清零 X/Z 自转，Y 轴慢速旋转以展示形状
                    particle.spinSpeed.set(0, (Math.random() - 0.5) * 0.6, 0);
                }
                particleSystem.push(particle);
            }

            mainGroup.add(photoMeshGroup);

            // 初始即生日形态，与默认标题 "Happy Birthday" 对齐（不触发转场彩屑）
            applyGreetingTheme('birthday', { burst: false });
        }

        function createDust() {
            const geo = new THREE.TetrahedronGeometry(0.08, 0);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.8 });
            
            for(let i=0; i<CONFIG.particles.dustCount; i++) {
                 const mesh = new THREE.Mesh(geo, mat);
                 mesh.scale.setScalar(0.5 + Math.random());
                 mainGroup.add(mesh);
                 particleSystem.push(new Particle(mesh, 'DUST', true));
            }
        }

        function addPhotoToScene(texture, sourceUrl = null) {
            let width = 1.2;
            let height = 1.2;
            
            if (texture.image) {
                const aspect = texture.image.width / texture.image.height;
                if (aspect > 1) {
                    height = width / aspect;
                } else {
                    width = height * aspect;
                }
            }

            // 🔍 调试日志：检查纹理属性
            console.log('📸 [addPhotoToScene] 创建照片:', {
                url: sourceUrl,
                textureColorSpace: texture.colorSpace,
                hasImage: !!texture.image,
                imageSize: texture.image ? `${texture.image.width}x${texture.image.height}` : 'N/A'
            });

            // 创建金色边框（受光照影响）
            const borderWidth = width * 1.15;  // 边框比照片大 15%
            const borderHeight = height * 1.15;
            const borderGeo = new THREE.PlaneGeometry(borderWidth, borderHeight);
            const borderMat = new THREE.MeshStandardMaterial({
                color: 0xFFD700,  // 金色
                metalness: 0.8,
                roughness: 0.2,
                side: THREE.DoubleSide,
                emissive: 0x443300,

                // 🔧 修复：降低边框自发光强度，避免触发 Bloom
                emissiveIntensity: 0.05  // 从 0.1 降至 0.05
            });
            const border = new THREE.Mesh(borderGeo, borderMat.clone());
            borderMat.dispose();
            border.position.z = -0.01;  // 边框在照片后面
            border.renderOrder = 998;  // 边框在照片之前渲染

            // 创建照片（不受光照影响）
            const photoGeo = new THREE.PlaneGeometry(width, height);
            const photoMat = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
                toneMapped: false,  // 关键：禁用色调映射，保持原始颜色
                
                // 🔧 修复：优化渲染顺序和深度测试
                // renderOrder 越大越晚渲染，确保照片在后处理前最后渲染
                // depthWrite: false 避免照片影响其他物体的深度测试
            });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = 0.01;  // 照片在前面
            photo.renderOrder = 999;  // 最高渲染优先级，最后渲染
            
            // 🔧 修复：设置照片图层，便于后续选择性渲染
            photo.layers.enable(0);  // 默认图层
            photo.layers.enable(1);  // 照片专用图层

            // 🔍 调试日志：检查照片材质属性
            console.log('🎨 [addPhotoToScene] 照片材质配置 (已优化):', {
                type: photoMat.type,
                toneMapped: photoMat.toneMapped,
                side: photoMat.side,
                renderOrder: photo.renderOrder,
                layers: photo.layers.mask,
                note: 'renderOrder=999 确保最后渲染，减少后处理影响'
            });

            // 组合边框和照片
            const group = new THREE.Group();
            group.add(border);
            group.add(photo);

            const s = 0.8;
            group.scale.set(s,s,s);
            group.userData.baseScale = s * 2.5;

            photoMeshGroup.add(group);
            const particle = new Particle(group, 'PHOTO', false);
            particleSystem.push(particle);

            // 保存照片元数据
            const photoData = {
                id: photoIdCounter++,
                url: sourceUrl || texture.image?.src || 'data:image',
                texture: texture,
                particle: particle,
                isVisible: true
            };
            photoDataArray.push(photoData);

            updatePhotoLayout();
            return photoData;
        }
        // wp/electronicminer wish you a Merry Christmas!
        function handleImageUpload(e) {
            const files = e.target.files;
            if(!files.length) return;
            
            Array.from(files).forEach(f => {
                if (!f.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t, ev.target.result);
                    });
                }
                reader.readAsDataURL(f);
            });
        }

        // --- 新增：照片管理功能 ---
        function removePhotoFromScene(photoData) {
            if (!photoData || !photoData.isVisible) return;

            // 从场景中移除mesh
            const particle = photoData.particle;
            if (particle && particle.mesh) {
                if (STATE.candidateTarget === particle.mesh) {
                    STATE.candidateTarget = null;
                }

                if (STATE.focusTarget === particle.mesh) {
                    STATE.focusTarget = null;
                    STATE.mode = 'SCATTER';
                }

                const removedPhotoIdx = particleSystem
                    .filter(p => p.type === 'PHOTO')
                    .indexOf(particle);

                photoMeshGroup.remove(particle.mesh);

                const index = particleSystem.indexOf(particle);
                if (index > -1) {
                    particleSystem.splice(index, 1);

                    const photoCount = particleSystem.filter(p => p.type === 'PHOTO').length;
                    if (photoCount === 0) {
                        STATE.focusIndex = -1;
                    } else if (removedPhotoIdx <= STATE.focusIndex) {
                        STATE.focusIndex--;
                    } else if (STATE.focusIndex >= photoCount) {
                        STATE.focusIndex = photoCount - 1;
                    }
                }

                // 清理几何体和材质
                if (particle.mesh.children) {
                    particle.mesh.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (child.material.map) child.material.map.dispose();
                            child.material.dispose();
                        }
                    });
                }
            }

            // 标记为不可见
            photoData.isVisible = false;

            // 重新布局剩余照片
            updatePhotoLayout();
        }

        function openPhotoManager() {
            const modal = document.getElementById('photo-manager-modal');
            const grid = document.getElementById('photo-grid');
            const count = document.getElementById('photo-count');
            
            // 清空网格
            grid.innerHTML = '';
            
            // 获取所有可见照片
            const visiblePhotos = photoDataArray.filter(p => p.isVisible);
            count.textContent = `Total Photos: ${visiblePhotos.length}`;
            
            if (visiblePhotos.length === 0) {
                grid.innerHTML = '<div style="color: rgba(var(--accent-rgb), 0.5); text-align: center; padding: 40px; grid-column: 1/-1;">No photos available</div>';
            } else {
                visiblePhotos.forEach(photoData => {
                    const item = document.createElement('div');
                    item.className = 'photo-item';
                    
                    // 创建缩略图
                    const img = document.createElement('img');
                    
                    // 处理不同类型的图片源
                    if (photoData.texture && photoData.texture.image) {
                        if (photoData.texture.image instanceof HTMLImageElement) {
                            img.src = photoData.texture.image.src;
                        } else if (photoData.texture.image instanceof HTMLCanvasElement) {
                            img.src = photoData.texture.image.toDataURL();
                        } else {
                            img.src = photoData.url;
                        }
                    } else {
                        img.src = photoData.url;
                    }
                    
                    img.alt = 'Photo';
                    img.onerror = () => {
                        img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23333" width="100" height="100"/><text x="50" y="50" text-anchor="middle" fill="%23ff4500" font-size="12">Image</text></svg>';
                    };
                    
                    // 创建删除覆盖层
                    const overlay = document.createElement('div');
                    overlay.className = 'delete-overlay';
                    overlay.innerHTML = '<div class="delete-icon">✕</div>';
                    
                    item.appendChild(img);
                    item.appendChild(overlay);
                    
                    // 点击删除
                    item.addEventListener('click', () => {
                        if (confirm('Delete this photo from the scene?\n(This will NOT delete the file from your ./images/ folder)')) {
                            removePhotoFromScene(photoData);
                            item.remove();
                            
                            // 更新计数
                            const newVisiblePhotos = photoDataArray.filter(p => p.isVisible);
                            count.textContent = `Total Photos: ${newVisiblePhotos.length}`;
                            
                            if (newVisiblePhotos.length === 0) {
                                grid.innerHTML = '<div style="color: rgba(var(--accent-rgb), 0.5); text-align: center; padding: 40px; grid-column: 1/-1;">No photos available</div>';
                            }
                        }
                    });
                    
                    grid.appendChild(item);
                });
            }
            
            modal.classList.add('active');
        }

        function closePhotoManager() {
            const modal = document.getElementById('photo-manager-modal');
            modal.classList.remove('active');
        }

        function setControlsCollapsed(collapsed) {
            const controls = document.getElementById('controls-wrapper');
            const toggle = document.getElementById('controls-toggle');
            if (!controls || !toggle) return;

            controls.classList.toggle('collapsed', collapsed);
            toggle.setAttribute('aria-label', collapsed ? 'Show controls' : 'Hide controls');
            toggle.title = collapsed ? 'Show controls' : 'Hide controls';
        }

        function scheduleControlsAutoHide() {
            clearTimeout(controlsAutoHideTimer);
            controlsAutoHideTimer = setTimeout(() => {
                setControlsCollapsed(true);
            }, CONTROLS_AUTO_HIDE_DELAY);
        }

        function revealControlsTemporarily() {
            setControlsCollapsed(false);
            scheduleControlsAutoHide();
        }

        function setupControlsAutoHide() {
            const controls = document.getElementById('controls-wrapper');
            const toggle = document.getElementById('controls-toggle');
            if (!controls || !toggle) return;

            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                revealControlsTemporarily();
            });

            controls.addEventListener('focusin', revealControlsTemporarily);

            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                controls.addEventListener('pointerenter', revealControlsTemporarily);
                controls.addEventListener('pointerleave', scheduleControlsAutoHide);
            } else {
                controls.addEventListener('pointerdown', revealControlsTemporarily);
            }

            scheduleControlsAutoHide();
        }

        // --- MEDIAPIPE (Adaptive Fix) ---
        async function initMediaPipe() {
            video = document.getElementById('webcam');
            
            // Adjust to get best available resolution if possible
            const constraints = {
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    frameRate: { ideal: 30 }
                }
            };

            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
            
            if (navigator.mediaDevices?.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                    debugInfo.innerText = "Webcam active. Show hand.";
                } catch(e) {
                    console.warn("Webcam access denied or not available", e);
                    debugInfo.innerText = "Camera error: " + e.message;
                    document.getElementById('webcam-wrapper').style.display = 'none';
                }
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    processGestures(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        // 修复核心：使用相对比例而非绝对距离
        function processGestures(result) {
            if (!(result.landmarks && result.landmarks.length > 0)) {
                STATE.hand.detected = false;
                STATE.mode = 'SCATTER';
                STATE.focusTarget = null;
                focusGestureFrameCount = 0;
                focusGestureReleaseFrameCount = 0;
                fireworkGestureFrameCount = 0;
                resetHandRotationTracking();
                debugInfo.innerText = "No hand detected";
                return;
            }

            const lm = result.landmarks[0];
            const thumb = lm[4];
            const indexTip = lm[8];
            const wrist = lm[0];
            const middleMCP = lm[9]; // 中指指根 (Knuckle)

            // 1. 计算手掌基准大小 (手腕到中指指根的距离)
            const handSize = Math.hypot(middleMCP.x - wrist.x, middleMCP.y - wrist.y);
            if (handSize < 0.02) {
                STATE.hand.detected = false;
                STATE.mode = 'SCATTER';
                STATE.focusTarget = null;
                focusGestureFrameCount = 0;
                focusGestureReleaseFrameCount = 0;
                fireworkGestureFrameCount = 0;
                resetHandRotationTracking();
                debugInfo.innerText = "Hand too small";
                return;
            }

            STATE.hand.detected = true;
            STATE.hand.x = (middleMCP.x - 0.5) * 2;
            STATE.hand.y = (middleMCP.y - 0.5) * 2;

            // 2. 计算手指尖端的平均伸展距离
            const tips = [lm[8], lm[12], lm[16], lm[20]];
            const tipDistances = tips.map(t => Math.hypot(t.x - wrist.x, t.y - wrist.y));
            const avgTipDist = tipDistances.reduce((s, d) => s + d, 0) / tipDistances.length;

            // 3. 计算捏合距离 (拇指到食指)
            const pinchDist = Math.hypot(thumb.x - indexTip.x, thumb.y - indexTip.y);

            // 4. 计算相对比例
            const extensionRatio = avgTipDist / handSize;
            const pinchRatio = pinchDist / handSize;
            const vGesture = isVGesture(lm, handSize);
            const fireworkCandidate =
                extensionRatio > FIREWORK_EXTENSION_THRESHOLD &&
                tipDistances.every(d => d > handSize * FIREWORK_MIN_FINGER_THRESHOLD);

            // 调试显示
            debugInfo.innerText =
                `Size: ${handSize.toFixed(2)} | Ext: ${extensionRatio.toFixed(2)} | ` +
                `V: ${vGesture ? '1' : '0'} | Pinch: ${pinchRatio.toFixed(2)} | Mode: ${STATE.mode}`;

            // 5. 状态判定：比耶进入 FOCUS，比耶释放退出 FOCUS
            if (vGesture) {
                focusGestureFrameCount = Math.min(focusGestureFrameCount + 1, FOCUS_ENTER_FRAMES);
                focusGestureReleaseFrameCount = 0;
                fireworkGestureFrameCount = 0;

                if (focusGestureFrameCount >= FOCUS_ENTER_FRAMES && STATE.mode !== 'FOCUS') {
                    const photos = particleSystem.filter(p => p.type === 'PHOTO');
                    if (photos.length === 0) {
                        STATE.mode = 'SCATTER';
                        STATE.focusTarget = null;
                    } else {
                        if (STATE.focusIndex === -1) {
                            const candidateIdx = STATE.candidateTarget
                                ? photos.findIndex(p => p.mesh === STATE.candidateTarget)
                                : -1;
                            STATE.focusIndex = candidateIdx !== -1 ? candidateIdx : 0;
                        } else {
                            STATE.focusIndex = (STATE.focusIndex + 1) % photos.length;
                        }
                        STATE.candidateTarget = null;
                        STATE.mode = 'FOCUS';
                        STATE.focusTarget = photos[STATE.focusIndex].mesh;
                        resetHandRotationTracking();
                    }
                }
            } else {
                focusGestureFrameCount = 0;

                if (STATE.mode === 'FOCUS') {
                    focusGestureReleaseFrameCount++;
                    if (focusGestureReleaseFrameCount >= FOCUS_EXIT_FRAMES) {
                        exitFocusMode();
                    }
                } else {
                    focusGestureReleaseFrameCount = 0;
                }

                if (STATE.mode !== 'FOCUS') {
                    if (extensionRatio < SCATTER_EXTENSION_THRESHOLD) {
                        fireworkGestureFrameCount = 0;
                        STATE.mode = 'SCATTER';
                        STATE.focusTarget = null;
                    } else if (fireworkCandidate) {
                        fireworkGestureFrameCount = Math.min(
                            fireworkGestureFrameCount + 1,
                            FIREWORK_ENTER_FRAMES
                        );
                        if (fireworkGestureFrameCount >= FIREWORK_ENTER_FRAMES) {
                            STATE.mode = 'FIREWORK';
                            STATE.focusTarget = null;
                            STATE.candidateTarget = null;
                        }
                    } else {
                        fireworkGestureFrameCount = 0;
                    }
                }
            }

            // 增量旋转更新
            if (STATE.mode === 'SCATTER' || STATE.mode === 'FIREWORK') {
                updateRotationFromHand(STATE.hand.x);
            } else {
                resetHandRotationTracking();
            }
        }
// wp/electronicminer wish you a Merry Christmas!
        function setupEvents() {
            window.addEventListener('resize', scheduleViewportResize, { passive: true });
            window.visualViewport?.addEventListener('resize', scheduleViewportResize, { passive: true });

            const canvasContainer = document.getElementById('canvas-container');
            if ('ResizeObserver' in window && canvasContainer) {
                viewportResizeObserver = new ResizeObserver(scheduleViewportResize);
                viewportResizeObserver.observe(canvasContainer);
            }
            
            document.getElementById('file-input').addEventListener('change', handleImageUpload);
            document.getElementById('folder-input').addEventListener('change', handleImageUpload);
            setupControlsAutoHide();
            
            // 照片管理按钮
            document.getElementById('manage-photos-btn').addEventListener('click', openPhotoManager);
            document.getElementById('close-modal-btn').addEventListener('click', closePhotoManager);

            // 祝福语切换：选哪个显示哪个
            const titleHeading = document.getElementById('title-heading');
            const greetingBtns = document.querySelectorAll('.greeting-btn');
            greetingBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    titleHeading.textContent = btn.dataset.greeting;
                    greetingBtns.forEach(b => b.classList.toggle('is-active', b === btn));
                    applyGreetingTheme(btn.dataset.theme);
                });
            });
            
            // 点击模态框背景关闭
            document.getElementById('photo-manager-modal').addEventListener('click', (e) => {
                if (e.target.id === 'photo-manager-modal') {
                    closePhotoManager();
                }
            });
            
            // ESC键关闭模态框
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closePhotoManager();
                }
                
                if (e.key.toLowerCase() === 'h') {
                    const controls = document.querySelector('.controls-wrapper');
                    if (controls) controls.classList.toggle('ui-hidden');
                    const webcam = document.getElementById('webcam-wrapper');
                    if(webcam) webcam.classList.toggle('ui-hidden');
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const currentTime = performance.now();
            const isFireworkMode = STATE.mode === 'FIREWORK';

            if (isFireworkMode && !wasFireworkMode) {
                fireworkPulseElapsed = 0;
            }
            if (isFireworkMode) {
                fireworkPulseElapsed = Math.min(FIREWORK_PULSE_DURATION, fireworkPulseElapsed + dt);
            } else {
                fireworkPulseElapsed = FIREWORK_PULSE_DURATION;
            }
            wasFireworkMode = isFireworkMode;

            // Rotation Logic: Y 轴由 processGestures() 更新 targetY，render 帧平滑追踪
            if ((STATE.mode === 'SCATTER' || STATE.mode === 'FIREWORK') && STATE.hand.detected) {
                const targetRotX = STATE.hand.y * ROTATION_X_LIMIT;
                STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.0 * dt;
            } else {
                if (STATE.mode !== 'FOCUS') {
                    STATE.rotation.targetY += 0.1 * dt;
                } else {
                    STATE.rotation.targetY = STATE.rotation.y;
                }
                STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt;
            }

            STATE.rotation.y += (STATE.rotation.targetY - STATE.rotation.y) * ROTATION_RENDER_SMOOTHING * dt;

            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;

            const fireworkPulseProgress = getFireworkPulseProgress();
            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget, fireworkPulseProgress));

            mainGroup.updateMatrixWorld(true);
            camera.updateMatrixWorld();

            if (STATE.mode === 'SCATTER') {
                updateCandidatePhoto();
            } else if (STATE.mode === 'FIREWORK') {
                STATE.candidateTarget = null;
            }

            updateThemeTransitions(dt);
            updateSnow(dt, isFireworkMode);
            updateThemeBurst(dt);
            const canLaunchFireworks = isFireworkMode && fireworkPulseElapsed >= FIREWORK_LAUNCH_DELAY;
            fireworkSystem.update(dt, currentTime, canLaunchFireworks);

            composer.render();
        }
// wp/electronicminer wish you a Merry Christmas!
        init();
    </script>
